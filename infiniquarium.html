function plantZ(p) {
  const t = PL[p.sp].type, an = A.tank.s.anchors[p.an];
  if (t === 'fern') return an ? an[2] - 0.5 : p.z;
  if (t === 'moss') return an ? an[2] : p.z;
  return p._z != null ? p._z : p.z;
}
function plantHit(px, py, maxD) {
  let best = null, bd = maxD;
  for (const p of A.tank.s.plants) {
    const pts = p._pts, t = PL[p.sp].type;
    if (!pts || t === 'float') continue;
    const z = plantZ(p), k = kz(z);
    const lim = t === 'moss' ? Math.max(maxD, (p._r || 2) * k) : maxD;
    for (let i = 0; i + 1 < pts.length; i += 2) {
      const d = Math.hypot(sx(pts[i], z) - px, sy(pts[i + 1], z) - py);
      const score = d + z * 0.25;
      if (d < lim && score < bd + (t === 'moss' ? lim : 0)) { bd = score; best = p; }
    }

}

  for (const q of p.ros) {
    const k = kz(q.z), X = sx(q.x, q.z), Y = sy(V.level, q.z);
    const r = Math.max(10, (0.9 + 1.4 * Math.sqrt(Math.max(q.m, 0.01) / 0.2)) * k * 1.1);
    const d = Math.hypot(X - px, (Y - py) * 1.6);

}

}
function pickAt(px, py, plantsOnly) {
  const T = A.tank, s = T.s, level = V.level;
  if (!plantsOnly) {

    let best = null, bd = 1e9;
    for (const ag of V.agents.values()) {
      if (ag.dead || ag.alpha < 0.3 || ag.sx == null) continue;
      if (ag.sp === 'mt' && ag.buried) continue;
      const k = kz(ag.z), r = Math.max(14, ag.a.L * k * 0.62);
      const d = Math.hypot(ag.sx - px, ag.sy - py);
      if (d < r) { const sc = d / r + ag.z * 0.004; if (sc < bd) { bd = sc; best = ag; } }

    if (best) return { k: 'animal', o: best };
    // egg clutches on the front glass
    for (const c of s.clutches) if (c.surf === 'fg' && Math.hypot(sx(c.x, 0) - px, sy(c.y, 0) - py) < 12) return { k: 'clutch', o: c };

  // floating plants at the surface
  const fh = frogHit(px, py);

    const h = A.hoverTrim;

    return null;

  for (const o of V.micro.cop) if (Math.hypot(sx(o.x, o.z) - px, sy(o.y, o.z) - py) < 7) return { k: 'micro', o: 'cop' };
  for (const o of V.micro.ost) if (Math.hypot(sx(o.x, o.z) - px, sy(o.y, o.z) - py) < 7) return { k: 'micro', o: 'ost' };
  for (const w of V.micro.worm) if (Math.hypot(sx(w.x + w.len / 2, 0) - px, sy(w.y, 0) - py) < 8) return { k: 'micro', o: 'worm' };

  const inRect = (x0, x1, y0, y1, z) => { const X0 = sx(x0, z), X1 = sx(x1, z), Y0 = sy(y1, z), Y1 = sy(y0, z); return px >= Math.min(X0, X1) - 4 && px <= Math.max(X0, X1) + 4 && py >= Y0 - 4 && py <= Y1 + 4; };

  if (inRect(68.2, 73.2, 35.2, 39.8, 27.5)) return { k: 'pump' };

  for (const st of s.stones) {

  const w0 = unproject(px, py, 0);

  const w30 = unproject(px, py, 30);
  if (w30.x >= -2 && w30.x <= 78 && w30.y < groundY(clamp(w30.x, 0, 76), 30) && w0.y > 0) return { k: 'sand' };
  if (w0.x >= 0 && w0.x <= 76 && w0.y > 0 && w0.y < level) return { k: 'water' };
  if (w0.x >= 0 && w0.x <= 76 && w0.y >= level && w0.y <= TANK.H) return { k: 'water' };
  return null;
}

    switch (k) {
      case 'l': case 'L': App.setMode('look'); break;
      case 't': case 'T': App.setMode('trim'); break;
      case 'f': App.feed(); break;
      case 'F': toggleFS(); break;
      case 'c': case 'C': App.togglePanel('water'); break;
      case 'p': case 'P': App.togglePanel('life'); break;
      case 'g': case 'G': App.togglePanel('log'); break;
      case '?': case '/': App.togglePanel('about'); break;
      case 'h': case 'H': if (A.uiHidden) wake(true); else hideUI(); break;
      case '[': App.setSpeed(A.spd - 1); break;
      case ']': App.setSpeed(A.spd + 1); break;
      case 'ArrowLeft': case 'ArrowRight': if (V.cam.panMax > V.cam.panMin) { V.cam.target = clamp(V.cam.target + (k === 'ArrowLeft' ? -6 : 6), V.cam.panMin, V.cam.panMax); A.follow = null; e.preventDefault(); } break;
      case 'Escape': if (!App.closeCard()) { if (!App.closePanel()) { if (A.mode !== 'look') App.setMode('look'); } } break;
      default:
        if (k >= '1' && k <= '6') App.setSpeed(+k - 1);
        else return;
    }
  });
  addEventListener('resize', () => { clearTimeout(A.rzT); A.rzT = setTimeout(resize, 120); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) App.save();
    else { A.last = performance.now(); A.idle = 0; }
  });
  addEventListener('pagehide', () => App.save());
  // on the desktop, a right-click shouldn't pop up a browser menu
  document.addEventListener('contextmenu', (e) => { if (A.wp) e.preventDefault(); });
  addEventListener('beforeunload', () => App.save());
}

/* ---------------- sizing & quality ---------------- */
function resize() {
  const W = Math.max(1, innerWidth), H = Math.max(1, innerHeight);
  const dpr0 = Math.min(2, window.devicePixelRatio || 1);
  const capPx = Math.sqrt(4.4e6 / (W * H));
  V.W = W; V.H = H;
  V.dpr = Math.max(0.5, Math.min(dpr0, capPx) * A.perf.scale);
  V.cv.width = Math.round(W * V.dpr); V.cv.height = Math.round(H * V.dpr);
  View.sizeLayers();
  const keep = V.cam.camX;
  View.fit();
  V.cam.camX = clamp(keep, V.cam.panMin, V.cam.panMax);
  GL.size(V.cv.width * 0.5, V.cv.height * 0.5);
  View.buildSubstrate(); A.subCam = V.cam.camX; A.subT = performance.now();
  V.moteN = Math.round(clamp(W * H / 18000, 40, 90));
  App.updateSpeedUI();
}
// quality follows the time budget of one frame: at a capped rate (the wallpaper) a slow-looking
// frame interval is only the cap, so judge by how much of the budget the work itself uses
function adaptQuality(work, frame, now) {
  const P = A.perf;
  P.work = P.work * 0.96 + work * 0.04;
  if (frame < 200) P.frame = P.frame * 0.96 + frame * 0.04;
  if (A.bench || now - P.t < 4000) return;
  const budget = A.fpsCap ? 1000 / A.fpsCap : 16.7;
  const late = P.frame > budget * 1.35;
  if ((P.work > budget * 0.8 || (late && P.work > budget * 0.45)) && P.scale > 0.55) { P.scale = Math.max(0.55, P.scale * 0.85); P.t = now; resize(); }
  else if (P.work < budget * 0.35 && !late && P.scale < 1 && now - P.t > 20000) { P.scale = Math.min(1, P.scale / 0.85); P.t = now; resize(); }
}

/* ---------------- diagnostics run (wallpaper with --log): time the frame at a few settings ---------------- */
const Prof = View.Prof;
const BENCH = [
  { name: 'drawing', scale: 1 },
  { name: 'paused', scale: 1, paused: true },
];
function benchStart() {
  A.bench = { i: -1, t: 0, n: 0, work: 0 };
  benchNext(performance.now());
}
function benchNext(now) {
  const B = A.bench;
  B.i++;
  App.setPaused(false);
  if (B.i >= BENCH.length) {
    A.bench = null; Prof.on = false;
    A.perf.scale = 1; A.perf.t = now; resize();
    App.tell({ t: 'diag', s: 'bench finished' });
    return;
  }
  const ph = BENCH[B.i];
  A.perf.scale = ph.scale; resize();
  B.t = now; B.warm = true; B.n = 0; B.work = 0;
  Prof.on = true; Prof.reset();
  if (ph.paused) App.setPaused(true);
  App.tell({ t: 'diag', s: 'bench ' + ph.name + ' start' });
}
function benchTick(now, work, raw) {
  const B = A.bench;
  if (B.warm) { if (now - B.t > 1500) { B.warm = false; B.t = now; Prof.reset(); B.n = 0; B.work = 0; B.hist = [0, 0, 0, 0]; App.tell({ t: 'diag', s: 'bench ' + BENCH[B.i].name + ' measure' }); } return; }
  B.n++; B.work += work;
  if (raw != null) B.hist[raw < 38 ? 0 : raw < 45 ? 1 : raw < 55 ? 2 : 3]++;
  if (now - B.t < 5000) return;
  const ph = BENCH[B.i];
  const r = { phase: ph.name, layered: !!V.layered, gl: GL.ok, canvas: [V.cv.width, V.cv.height], dpr: +V.dpr.toFixed(3), fps: +(B.n * 1000 / (now - B.t)).toFixed(1), workMs: +(B.work / Math.max(1, B.n)).toFixed(2), gaps: B.hist, sections: Prof.report() };
  App.tell({ t: 'diag', s: 'bench ' + ph.name + ' done ' + JSON.stringify(r) });
  benchNext(now);
}

/* ---------------- light, water and the view state per frame ---------------- */
function updateScene(dt, days) {
  const T = A.tank, e = envAt(T.s.t);
  // at high speed the days blur into a steady, averaged light
  const spd = V.speed, tau = spd <= 1500 ? 0 : spd <= 11000 ? 0.5 : spd <= 50000 ? 1.6 : 4;
  // and leans toward daylight, so a fast-forwarding tank stays easy to watch
  const bias = spd <= 11000 ? 0 : spd <= 50000 ? 0.45 : 0.8;
  const tl = e.lamp + (0.85 - e.lamp) * bias, td = e.day + (0.45 - e.day) * bias;
  if (!A.le || tau === 0) A.le = { lamp: tl, day: td, moon: e.moon };
  else { const k = 1 - Math.exp(-dt / tau); A.le.lamp += (tl - A.le.lamp) * k; A.le.day += (td - A.le.day) * k; A.le.moon += (e.moon - A.le.moon) * k; }
  V.L = View.lightFrom(A.le);
  V.heating = e.troom + 0.7 + 0.8 * e.lamp < TANK.heater;
  const lv = levelOf(T.s.w.V);
  V.level += (lv - V.level) * Math.min(1, dt * 1.5);
  if (days > 0) V.film.step(days);
  A.coverT -= dt; A.mapT -= dt;
  if (A.coverT <= 0) { A.coverT = 0.5; GL.setCover((x) => T.coverAt(x)); }
  if (A.mapT <= 0 || V.plantById.size !== T.s.plants.length) { A.mapT = 1; V.plantById = new Map(T.s.plants.map((p) => [p.id, p])); }
  if (V.spawnHints && V.spawnHints.length) { for (const h of V.spawnHints) h.ttl -= dt; V.spawnHints = V.spawnHints.filter((h) => h.ttl > 0 && h.n > 0); }
  // camera: follow a selected animal, ease toward the target
  const c = V.cam;
  if (A.follow) { if (A.follow.dead) A.follow = null; else c.target = clamp(A.follow.x, c.panMin, c.panMax); }
  if (Math.abs(c.target - c.camX) > 0.005) c.camX += (c.target - c.camX) * Math.min(1, dt * 3.2);
  const now = performance.now();
  if (Math.abs(c.camX - A.subCam) > 0.02 && now - A.subT > 160) { View.buildSubstrate(); A.subCam = c.camX; A.subT = now; }
}

/* ---------------- the loop ---------------- */
let msT = 0, loopRaf = 0, loopTimer = 0;
function schedule() {
  if (loopRaf || loopTimer) return;
  if (A.hostPaused) loopTimer = setTimeout(() => { loopTimer = 0; frame(); }, 1000);
  else loopRaf = requestAnimationFrame(() => { loopRaf = 0; frame(); });
}
// the wallpaper app pauses drawing while windows cover the desktop; the tank itself keeps time
App.setPaused = function (on) {
  on = !!on;
  if (on === !!A.hostPaused) return;
  A.hostPaused = on;
  if (!on) { if (loopTimer) { clearTimeout(loopTimer); loopTimer = 0; } A.last = performance.now() - 1000 / (A.fpsCap || 60); schedule(); }
};
function idleTick(now) {
  A.last = now;
  if (A.bench) benchTick(now, 0);
  if (A.passive || !A.tank || A.mirror) return;
  if (A.catch) { App.stepCatchUp(); return; }
  App.stepTime(0.1);
  App.drainEvents(false);
  Log.tick(A.tank.s.t);
  App.milestones();
  if (now - A.lastSave > 60000) App.save();
}
function frame() {
  schedule();
  const now = performance.now();
  if (A.hostPaused) { idleTick(now); return; }
  if (A.fpsCap && now - A.last < 1000 / A.fpsCap - 2) return;     // a wallpaper doesn't need every display refresh
  const raw = now - A.last;
  const dt = Math.min(0.1, Math.max(0, raw / 1000));
  A.last = now;
  if (A.passive || !A.tank) return;
  if (LINK) Link.beat(now);   // keep the claim alive, even through a long catch-up
  if (A.catch && !A.mirror) {
    App.stepCatchUp();
    App.updateHUD();
    if (A.catch) return;
  }
  Prof.start();
  // following the browser tab: the tank's state arrives from there, this view only animates it
  const days = A.mirror ? 0 : App.stepTime(dt);
  if (!A.mirror) {
    App.drainEvents(false);
    Log.tick(A.tank.s.t);
    msT += dt; if (msT > 1) { msT = 0; App.milestones(); }
  }
  V.t += dt;
  Prof.lap('sim');
  updateScene(dt, days);
  Prof.lap('scene');
  View.updateLife(dt);
  V.fresh = false;
  if (V.cycle) App.Motes.step(dt);
  App.pearl(dt);
  Prof.lap('life');
  View.render();
  // interface
  A.hudT -= dt; if (A.hudT <= 0) { A.hudT = 0.25; App.updateHUD(); }
  App.renderPanel(false, dt);
  App.stepFlowDots(dt);
  App.refreshCard(dt);
  A.idle += dt;
  if (!A.faded && A.idle > (A.wp ? 20 : 7) && !A.panel && !App.cardOpen() && A.mode === 'look' && $('#veil').hidden && !A.pdown) fade();
  if (LINK) Link.tick(now);
  else if (now - A.lastSave > 60000) App.save();
  Prof.lap('ui'); Prof.frame();
  const work = performance.now() - now;
  if (A.bench) benchTick(now, work, raw);
  else if (A.benchAt && now > A.benchAt) { A.benchAt = 0; benchStart(); }
  adaptQuality(work, raw, now);
}

/* ---------------- start ---------------- */
App.afterAdopt = function () {
  App.closeCard(); App.Motes.clear();
  V.fresh = true; A.le = null; A.coverT = 0; A.mapT = 0;
  resize();
  App.updateSpeedUI(); App.updateHUD();
  if (A.panel) App.renderPanel(true);
};
App.onCatchUp = function () { App.Motes.clear(); A.coverT = 0; A.mapT = 0; };
App.cardOpen = function () { return !$('#card').hidden; };

function boot() {
  V.cv = $('#tank');
  View.useLayers(V.cv);
  V.ctx = V.cv.getContext('2d', { alpha: !!V.layered });
  View.installGL();
  bindCanvas(); bindUI();
  const saved = App.loadSaved();
  if (LINK && !saved) { linkDown(); return; }   // never start a new tank over the wallpaper's
  if (saved) {
    App.adopt(saved.T, saved.app);
    if (saved.app.spd > 0) App.setSpeed(0, true);
    A.uiHidden = !!saved.app.uiHidden;
  } else {
    App.resetTank(true);
  }
  App.afterAdopt();
  // a first frame of the tank as it was
  V.t = 5 + Math.random() * 100;
  const e = envAt(A.tank.s.t);
  A.le = { lamp: e.lamp, day: e.day, moon: e.moon }; V.L = View.lightFrom(A.le);
  GL.setCover((x) => A.tank.coverAt(x));
  for (let i = 0; i < 20; i++) { View.updateLife(1 / 30); V.fresh = false; }
  View.render();
  if (A.wp) { A.welcomed = true; if (App.HOST && App.HOST.insets) App.setInsets(App.HOST.insets); App.setInteractive(A.interactive); App.tell({ t: 'ready' }); if (App.HOST && App.HOST.diag) A.benchAt = performance.now() + 4000; }
  else {
    if (A.uiHidden) { A.faded = true; ui.classList.add('faded'); document.body.classList.add('hide-cursor'); }
    if (LINK) { A.welcomed = true; toast('This is your wallpaper\u2019s tank. What you do here shows on your desktop.'); }
    else if (!saved || !A.welcomed) App.showWelcome();
  }
  A.last = performance.now(); A.lastSave = performance.now();
  schedule();
}

// only one tab keeps the tank: a newer tab asks older ones to save and stand aside
function claim(then) {
  let bc = null;
  try { bc = new BroadcastChannel('infiniquarium'); } catch (err) { bc = null; }
  if (!bc) { then(); return; }
  bc.onmessage = (m) => {
    const d = m.data || {};
    if (d.hello && d.tab !== A.tabId && A.tank && !A.passive) {
      App.save(); A.passive = true;
      bc.postMessage({ saved: 1, tab: A.tabId });
      App.sheet('<h2>Open in another tab</h2><p>Infiniquarium is now running in another tab or window. One tank, one place: this one is paused so the two don\'t overwrite each other.</p><button class="go" id="here">Keep it here instead</button>');
      $('#here').onclick = () => location.reload();
    }
  };
  bc.postMessage({ hello: 1, tab: A.tabId });
  setTimeout(then, 140);
}
/* ---------------- a browser tab driving the wallpaper's tank ----------------
 * The app keeps the tank. This tab fetches it, claims it, sends it back every few seconds (at once after
 * anything you do) and hands it back when it's hidden or closed. One owner at a time: a newer tab or window
 * takes over and the older one pauses, as with two tabs of the plain page. */
const LINK = App.LINK;
const Link = {
  owner: false, chain: Promise.resolve(), latest: null, queued: false, fails: 0, warned: false, beatT: 0, kickAt: 0, gone: false,
  q() { return '?k=' + encodeURIComponent(LINK.key) + '&tab=' + A.tabId; },
  get() { return fetch('/state' + Link.q(), { cache: 'no-store' }).then((r) => { if (!r.ok) throw new Error('state ' + r.status); return r.text(); }); },
  post(path, body) { return fetch(path + Link.q(), { method: 'POST', body: body || '', headers: { 'Content-Type': 'text/plain' }, cache: 'no-store' }); },
  heard(r) {
    if (r && r.status === 409) { Link.lost(); return; }
    if (r && r.ok) { Link.fails = 0; return; }
    if (++Link.fails >= 3 && !Link.warned) { Link.warned = true; toast('Can\u2019t reach the wallpaper app, so changes here won\u2019t show on your desktop for now.'); }
  },
  // newest state wins; posts go one at a time, in order
  save(str) {
    if (!Link.owner) return false;
    Link.send(str);
    return true;
  },
  send(str) {
    Link.latest = str;
    if (Link.queued) return;
    Link.queued = true;
    Link.chain = Link.chain.then(() => {
      Link.queued = false;
      const s = Link.latest; Link.latest = null;
      if (!s) return null;
      return Link.post('/state', s).then(Link.heard, () => Link.heard(null));
    });
  },
  claim() { Link.owner = true; Link.beatT = performance.now(); Link.post('/claim').then(Link.heard, () => Link.heard(null)); },
  handBack() {
    if (!Link.owner) return;
    try { if (A.tank && !A.catch && !A.passive) Link.send(App.saveString()); } catch (err) { /* keep going */ }
    Link.owner = false;
    Link.chain = Link.chain.then(() => Link.post('/release').then(() => { Link.gone = true; }, () => {}));
  },
  // back from another tab: the wallpaper may have moved on meanwhile
  resume() {
    if (Link.owner || A.passive || !A.tank) return;
    Link.gone = false;
    Link.get().then((str) => { App.mirrorAdopt(str); A.last = performance.now(); Link.claim(); }, () => { Link.heard(null); Link.claim(); });
  },
  // another tab or window took the tank over
  lost() {
    if (A.passive) return;
    Link.owner = false; A.passive = true;
    App.sheet('<h2>Open in another tab</h2><p>Your wallpaper\u2019s tank is now open in another tab or window. One tank, one place: this one is paused so the two don\u2019t overwrite each other.</p><button class="go" id="here">Keep it here instead</button>');
    $('#here').onclick = () => location.reload();
  },
  beat(now) {
    if (!Link.owner || A.passive || now - Link.beatT < 5000) return;
    Link.beatT = now;
    Link.post('/beat').then(Link.heard, () => Link.heard(null));
  },
  tick(now) {
    if (!Link.owner || A.passive) return;
    const every = A.spd > 0 ? 2000 : 8000;
    if (now - A.lastSave > every || (Link.kickAt && now > Link.kickAt)) { Link.kickAt = 0; App.save(); }
  },
  start() {
    // anything you do here reaches the wallpaper within half a second
    const kick = () => { if (!Link.kickAt) Link.kickAt = performance.now() + 450; };
    document.addEventListener('pointerup', kick, true);
    document.addEventListener('keyup', kick, true);
    document.addEventListener('change', kick, true);
    document.addEventListener('visibilitychange', () => { if (document.hidden) Link.handBack(); else Link.resume(); });
    addEventListener('pagehide', () => { if (!Link.gone) navigator.sendBeacon('/release' + Link.q(), ''); });
  },
};
App.linkSave = (str) => Link.save(str);
function linkDown() {
  App.sheet('<h2>Your wallpaper isn\u2019t running</h2><p>This page opens the tank from the Infiniquarium wallpaper, and it can\u2019t reach it right now. Start Infiniquarium from the Applications folder in your home folder, then reload this page.</p><button class="go" id="again">Reload</button>');
  $('#again').onclick = () => location.reload();
}

// following the browser tab (wallpaper): stop running the tank here and show what arrives
App.setMirror = function (on) {
  on = !!on;
  if (on === !!A.mirror) return;
  A.mirror = on;
  if (on) { A.catch = null; A.sync = null; }
  else { A.last = performance.now(); A.lastSave = performance.now(); }
};

// what the wallpaper app (or anything hosting the page) can ask of it
window.Infiniquarium = {
  setInteractive: (on) => App.setInteractive(on),
  setFps: (n) => App.setFps(n),
  setInsets: (o) => App.setInsets(o),
  save: () => App.save(),
  bench: () => { if (!A.bench) A.benchAt = performance.now(); },
  setPaused: (on) => App.setPaused(on),
  setMirror: (on) => App.setMirror(on),
  mirrorState: (str) => App.mirrorAdopt(str),
  stateString: () => (A.tank ? App.saveString() : null),
  status: () => ({ interactive: A.interactive, fps: A.fpsCap, day: A.tank ? App.dayNo(A.tank.s.t) : 0, animals: A.tank ? A.tank.s.animals.length : 0,
    visible: document.visibilityState, frameMs: +A.perf.frame.toFixed(1), workMs: +A.perf.work.toFixed(1), scale: A.perf.scale, dpr: +V.dpr.toFixed(2), size: [V.W, V.H], canvas: [V.cv.width, V.cv.height], gl: GL.ok, layered: !!V.layered, paused: !!A.hostPaused, mirror: !!A.mirror, t: A.tank ? A.tank.s.t : 0, level: +V.level.toFixed(2), plants: A.tank ? A.tank.s.plants.length : 0 }),
};
if (A.wp) boot();
else if (LINK) {
  Link.get().then((str) => { LINK.boot = str; claim(() => { boot(); if (A.tank) { Link.start(); Link.claim(); App.save(); } }); },
    () => linkDown());
}
else claim(boot);
})();

</script>
</body>
