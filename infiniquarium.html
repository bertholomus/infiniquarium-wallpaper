<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030605">
<meta name="description" content="A planted aquarium that looks after itself: a living Walstad tank that follows your clock.">
<title>Infiniquarium</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23123029'/%3E%3Cpath d='M14 50c4-14 6-22 4-34M24 52c2-12 6-18 3-30M46 52c-3-10 1-20 6-26' stroke='%236fd3a8' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Cpath d='M28 30c6-6 14-6 20 0-6 6-14 6-20 0z' fill='%23e8643a'/%3E%3Cpath d='M28 30l-6-4v8z' fill='%23e8643a'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: dark;
  --bg: #030605;
  --surface-1: #101918;
  --surface-2: #15201f;
  --surface-3: #1c2928;
  --hair: rgba(255, 255, 255, 0.08);
  --hair-2: rgba(255, 255, 255, 0.14);
  --text-1: #eef3f1;
  --text-2: #b6c3bf;
  --text-3: #7f8e8a;
  --accent: #6fd3a8;
  --accent-ink: #062016;
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --good: #0ca30c;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --r: 14px;
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text-1); font: 13px/1.45 var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; }
canvas#tank { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; outline: none; }
/* the tank's other layers, blended by the compositor (see View.useLayers in the renderer) */
#scene { position: fixed; inset: 0; isolation: isolate; }
.fx { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; pointer-events: none; }
#fxc { mix-blend-mode: plus-lighter; opacity: .85; }
#fxs, #fxt { mix-blend-mode: multiply; }
#fxr { mix-blend-mode: plus-lighter; }
#fxt[hidden] { display: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ui { position: fixed; inset: 0; pointer-events: none; transition: opacity .8s var(--ease); }
.ui > * { pointer-events: auto; }
.ui.faded { opacity: 0; }
.ui.faded > * { pointer-events: none; }
body.hide-cursor, body.hide-cursor canvas#tank { cursor: none; }

/* heads-up clock */
.hud { position: absolute; left: max(calc(var(--il, 0px) + 16px), env(safe-area-inset-left)); top: max(calc(var(--it, 0px) + 14px), env(safe-area-inset-top)); pointer-events: none; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
.brand { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--text-2); font-weight: 600; }
.clock { margin-top: 2px; font-size: 13px; color: var(--text-1); display: flex; gap: 6px; align-items: baseline; font-variant-numeric: tabular-nums; }
.clock .sub { color: var(--text-3); }
.badge { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; padding: 3px 9px; border-radius: 999px; background: rgba(111, 211, 168, .14); color: var(--accent); font-size: 11.5px; font-weight: 600; letter-spacing: .02em; }
.badge[hidden] { display: none; }
.badge .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .25; } }

/* dock */
.dock { position: absolute; left: 50%; bottom: max(calc(var(--ib, 0px) + 14px), env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 18px; background: rgba(12, 20, 19, .78); border: 1px solid var(--hair); box-shadow: var(--shadow); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); max-width: calc(100vw - 16px); }
.dock .grp { display: flex; gap: 2px; align-items: center; }
.dock .sep { width: 1px; height: 22px; background: var(--hair-2); margin: 0 4px; }
.dock button { height: 40px; min-width: 40px; padding: 0 10px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; color: var(--text-2); font-size: 12.5px; font-weight: 550; white-space: nowrap; transition: background .15s, color .15s; }
.dock button:hover { background: rgba(255, 255, 255, .06); color: var(--text-1); }
.dock button.on { background: rgba(111, 211, 168, .16); color: var(--accent); }
.dock button svg { width: 19px; height: 19px; flex: none; }
.dock .speed { min-width: 124px; font-variant-numeric: tabular-nums; color: var(--text-1); }
.dock .speed .tiny { color: var(--text-3); font-weight: 500; }
.dock .arrow { min-width: 30px; padding: 0 6px; }
@media (max-width: 860px) { .dock button .lbl { display: none; } .dock .speed { min-width: 86px; } }
@media (max-width: 520px) { .dock .opt { display: none; } .dock button { min-width: 36px; height: 38px; padding: 0 7px; } .dock .arrow { display: none; } .dock .sep { margin: 0 2px; } }

/* side panel */
.panel { position: absolute; top: calc(var(--it, 0px) + 12px); right: calc(var(--ir, 0px) + 12px); bottom: calc(var(--ib, 0px) + 76px); width: min(380px, calc(100vw - 24px)); background: rgba(14, 22, 21, .9); border: 1px solid var(--hair); border-radius: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; transform: translateX(420px); opacity: 0; visibility: hidden; transition: transform .45s var(--ease), opacity .3s, visibility 0s linear .45s; }
.panel.open { transform: none; opacity: 1; visibility: visible; transition: transform .45s var(--ease), opacity .3s, visibility 0s; }
.panel-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 10px 6px 14px; border-bottom: 1px solid var(--hair); }
.tabs { display: flex; gap: 2px; }
.tabs button { padding: 6px 10px; border-radius: 9px; color: var(--text-3); font-weight: 600; font-size: 12.5px; }
.tabs button.on { color: var(--text-1); background: var(--surface-3); }
.icon-btn { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: var(--text-3); }
.icon-btn:hover { background: rgba(255,255,255,.06); color: var(--text-1); }
.panel-body { flex: 1; overflow-y: auto; padding: 14px; scrollbar-width: thin; scrollbar-color: #2b3a38 transparent; }
.panel section[hidden] { display: none; }
@media (max-width: 640px) {
  .panel { top: auto; left: 8px; right: 8px; bottom: calc(var(--ib, 0px) + 68px); width: auto; height: 58vh; transform: translateY(calc(58vh + 90px)); }
  .panel.open { transform: none; }
}
h3 { margin: 18px 0 8px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); font-weight: 650; }
h3:first-child { margin-top: 2px; }
.lede { color: var(--text-2); margin: 0 0 12px; }
.muted { color: var(--text-3); }
.small { font-size: 12px; }

/* stat tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: var(--surface-2); border: 1px solid var(--hair); border-radius: 12px; padding: 9px 10px 8px; cursor: pointer; text-align: left; width: 100%; transition: border-color .15s; }
.tile:hover { border-color: var(--hair-2); }
.tile.sel { border-color: rgba(111, 211, 168, .5); }
.tile .lab { color: var(--text-3); font-size: 11.5px; display: flex; justify-content: space-between; gap: 6px; }
.tile .val { font-size: 19px; font-weight: 620; color: var(--text-1); margin-top: 1px; }
.tile .val small { font-size: 11.5px; font-weight: 500; color: var(--text-3); margin-left: 3px; }
.tile svg.spark { display: block; width: 100%; height: 26px; margin-top: 4px; overflow: visible; }
.status { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-2); white-space: nowrap; }
.status i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.status.good i { background: var(--good); } .status.warning i { background: var(--warning); } .status.serious i { background: var(--serious); } .status.critical i { background: var(--critical); }

/* chart */
.chart { position: relative; background: var(--surface-2); border: 1px solid var(--hair); border-radius: 12px; padding: 10px 12px 8px; margin-top: 10px; }
.chart .ttl { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.chart .ttl b { font-weight: 620; font-size: 12.5px; }
.chart .seg { display: flex; gap: 2px; }
.chart .seg button { font-size: 11px; padding: 2px 7px; border-radius: 7px; color: var(--text-3); }
.chart .seg button.on { background: var(--surface-3); color: var(--text-1); }
.chart svg { display: block; width: 100%; height: 120px; margin-top: 6px; overflow: visible; }
.chart .tip { position: absolute; pointer-events: none; background: #0b1110; border: 1px solid var(--hair-2); border-radius: 8px; padding: 5px 8px; font-size: 11.5px; white-space: nowrap; transform: translate(-50%, -110%); opacity: 0; transition: opacity .1s; }
.chart .tip b { color: var(--text-1); font-weight: 650; }
.chart .tip span { color: var(--text-3); }
.axis { fill: var(--text-3); font-size: 10px; font-variant-numeric: tabular-nums; }

/* cycle diagram */
.cycle svg { width: 100%; height: auto; display: block; }
.cycle .node rect { fill: var(--surface-3); stroke: var(--hair-2); }
.cycle .node text { fill: var(--text-1); font-size: 11px; font-weight: 600; }
.cycle .node .v { fill: var(--text-3); font-weight: 500; font-size: 10px; }
.cycle .flow { fill: none; stroke: rgba(111, 211, 168, .5); stroke-linecap: round; }
.cycle .dot { fill: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 8px; color: var(--text-2); font-size: 11.5px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }
.legend i.dotk { width: 8px; height: 8px; border-radius: 50%; }

/* census */
.sp { background: var(--surface-2); border: 1px solid var(--hair); border-radius: 12px; padding: 10px 11px; margin-bottom: 8px; }
.sp-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sp-h b { font-weight: 620; }
.sp-h em { color: var(--text-3); font-style: italic; font-size: 11.5px; }
.sp-n { font-size: 18px; font-weight: 620; }
.sp-row { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
.sp-row svg { flex: 1; height: 28px; overflow: visible; }
.sp-meta { color: var(--text-3); font-size: 11.5px; margin-top: 3px; }
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; margin-top: 7px; }
.bar i { display: block; height: 100%; }
.plantrow { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 7px 0; border-bottom: 1px solid var(--hair); }
.plantrow:last-child { border-bottom: 0; }
.meter { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: rgba(111, 211, 168, .12); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.meter.warn i { background: var(--warning); }

/* log */
.log { list-style: none; margin: 0; padding: 0; }
.log li { display: grid; grid-template-columns: 74px 1fr; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--hair); color: var(--text-2); }
.log li .t { color: var(--text-3); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.log li.k-you { color: var(--text-1); }
.log li.k-note { color: var(--accent); }
.log li.day .t { color: var(--text-2); }
.log-filters { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
.log-filters button { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--hair); color: var(--text-3); }
.log-filters button.on { color: var(--text-1); border-color: var(--hair-2); background: var(--surface-3); }

/* inspector card */
.card { position: absolute; width: min(320px, calc(100vw - 24px)); background: rgba(14, 22, 21, .94); border: 1px solid var(--hair-2); border-radius: 16px; box-shadow: var(--shadow); padding: 12px 13px 12px; opacity: 0; transform: translateY(6px) scale(.98); transition: opacity .2s, transform .2s var(--ease); }
.card.show { opacity: 1; transform: none; }
.card[hidden] { display: none; }
.card .ch { display: flex; justify-content: space-between; gap: 8px; }
.card h4 { margin: 0; font-size: 15px; font-weight: 650; }
.card .sci { color: var(--text-3); font-style: italic; font-size: 12px; }
.card .facts { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 8px 0 6px; font-size: 12.5px; color: var(--text-1); }
.card .facts span { white-space: nowrap; }
.card .facts span b { color: var(--text-3); font-weight: 500; margin-right: 4px; }
.card p { margin: 6px 0 0; color: var(--text-2); font-size: 12.5px; }
.card .state { color: var(--accent); font-size: 12.5px; margin-top: 6px; }
.card .row { display: flex; gap: 6px; margin-top: 10px; }
.card .btn { font-size: 12px; padding: 5px 10px; border-radius: 9px; border: 1px solid var(--hair-2); color: var(--text-2); }
.card .btn:hover { color: var(--text-1); }
@media (max-width: 640px) { .card { left: 8px !important; right: 8px; bottom: calc(var(--ib, 0px) + 68px); top: auto !important; width: auto; } }

/* toasts */
.toasts { position: absolute; top: max(calc(var(--it, 0px) + 14px), env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.toast { background: rgba(12, 20, 19, .9); border: 1px solid var(--hair); color: var(--text-1); padding: 7px 13px; border-radius: 999px; font-size: 12.5px; box-shadow: var(--shadow); animation: toast 4.2s var(--ease) forwards; }
@keyframes toast { 0% { opacity: 0; transform: translateY(-6px); } 8%, 82% { opacity: 1; transform: none; } 100% { opacity: 0; } }

/* overlays */
.veil { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(2, 6, 5, .55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); transition: opacity .5s; }
.veil[hidden] { display: none; }
.sheet { width: min(460px, calc(100vw - 32px)); background: rgba(14, 22, 21, .96); border: 1px solid var(--hair-2); border-radius: 20px; padding: 22px 22px 18px; box-shadow: var(--shadow); }
.sheet h2 { margin: 0 0 4px; font-size: 20px; font-weight: 680; letter-spacing: -.01em; }
.sheet p { color: var(--text-2); margin: 8px 0; }
.sheet ul { margin: 8px 0; padding-left: 18px; color: var(--text-2); }
.sheet li { margin: 3px 0; }
.sheet .go { margin-top: 12px; display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: var(--accent-ink); font-weight: 680; padding: 9px 16px; border-radius: 12px; }
.sheet .ghost { margin-top: 12px; margin-left: 6px; color: var(--text-2); padding: 9px 12px; border-radius: 12px; }
.progress { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; margin-top: 14px; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .15s; }
.kbd { display: inline-block; min-width: 20px; padding: 0 5px; border: 1px solid var(--hair-2); border-radius: 5px; font-size: 11px; text-align: center; color: var(--text-2); }
.about dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 12.5px; }
.about dt { color: var(--text-3); }
.about dd { margin: 0; color: var(--text-1); }
.about p { color: var(--text-2); }
.danger { color: #ffb4a8 !important; border-color: rgba(208, 59, 59, .5) !important; }
.hint { position: fixed; z-index: 5; bottom: calc(var(--ib, 0px) + 20px); left: 50%; transform: translateX(-50%); background: rgba(12,20,19,.8); border: 1px solid var(--hair); color: var(--text-2); padding: 6px 12px; border-radius: 999px; font-size: 12px; pointer-events: none; transition: opacity .6s; }
.hint[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* card details */
.card .role { color: var(--text-2); font-size: 12px; font-weight: 600; margin-top: 2px; }
.card .tr { color: var(--text-1); }
.card .kin { color: var(--text-3); font-size: 12px; }
.lnk { color: var(--accent); padding: 0; text-decoration: underline; text-underline-offset: 2px; }
.card { max-height: calc(100vh - 150px); overflow-y: auto; }
/* away summary */
table.away { width: 100%; border-collapse: collapse; margin: 10px 0 4px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
table.away th { color: var(--text-3); font-weight: 600; font-size: 11.5px; text-align: left; padding: 4px 0; border-bottom: 1px solid var(--hair); }
table.away td { padding: 4px 0; border-bottom: 1px solid var(--hair); color: var(--text-1); }
table.away .n, table.away .d { text-align: right; padding-left: 10px; }
table.away td.d { color: var(--text-2); white-space: nowrap; }
.danger-go { background: #d03b3b !important; color: #fff !important; }
/* nitrogen pools */
.pool { display: grid; grid-template-columns: 150px 1fr auto; gap: 10px; align-items: center; padding: 4px 0; font-size: 12.5px; color: var(--text-2); }
.pool .bar1 { height: 8px; background: rgba(111, 211, 168, .1); border-radius: 4px; overflow: hidden; }
.pool .bar1 i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.pool .pv, .plantrow .pv { color: var(--text-1); font-variant-numeric: tabular-nums; }
@media (max-width: 420px) { .pool { grid-template-columns: 118px 1fr auto; } }
/* cycle diagram extras */
.cycle .fv { fill: var(--text-2); font-size: 9.5px; font-variant-numeric: tabular-nums; paint-order: stroke; stroke: #0e1615; stroke-width: 3px; stroke-linejoin: round; }
.cycle .flow.idle { stroke: rgba(255, 255, 255, .12); stroke-dasharray: 2 4; }
.cycle .dots circle { fill: #bff2d9; }
.spark2 { flex: 1; height: 28px; display: block; }
.tile .note { margin-top: 6px; line-height: 1.3; }
.keys { grid-template-columns: 58px 1fr !important; }
.row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.about .btn { font-size: 12px; padding: 6px 11px; border-radius: 9px; border: 1px solid var(--hair-2); color: var(--text-2); }
.about .btn:hover { color: var(--text-1); }
.log li.k-digest span:last-child { color: var(--text-3); }
.log li.k-you span:last-child { color: var(--text-1); }
.log li.k-note span:last-child { color: var(--accent); }
.log li.day { border-bottom-color: var(--hair-2); padding-top: 14px; }
.log li.day span:first-child { color: var(--text-1); font-weight: 600; }
.dock button:disabled { opacity: .35; cursor: default; }
.dock button:disabled:hover { background: none; }
.chart .seg button:disabled { opacity: .35; cursor: default; }
noscript { position: fixed; inset: 0; display: grid; place-items: center; color: var(--text-2); }

/* wallpaper mode: nothing on screen until you choose to interact */
body.wp-passive .ui, body.wp-passive .hint { display: none !important; }
body.wp #btn-fs { display: none; }

</style>
</head>
<body>
<noscript>Infiniquarium needs JavaScript to run.</noscript>
<canvas id="tank" tabindex="0" aria-label="Infiniquarium: a living planted aquarium. Click anything to learn about it."></canvas>
<div class="ui" id="ui">
  <div class="hud" id="hud">
    <div class="brand">Infiniquarium</div>
    <div class="clock"><span id="clk">--:--</span><span class="sub" id="date">—</span></div>
    <div class="badge" id="badge" hidden><span class="pulse"></span><span id="badge-t"></span></div>
  </div>

  <nav class="dock" id="dock" aria-label="Controls">
    <div class="grp" role="group" aria-label="Tools">
      <button class="on" data-mode="look" title="Look — click anything to learn about it (L)" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span class="lbl">Look</span></button>
      <button data-mode="trim" title="Trim — click a plant where you want to cut (T)" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.1 8.1 20 20M8.1 15.9 20 4"/></svg><span class="lbl">Trim</span></button>
      <button id="btn-feed" title="Feed a pinch of flakes (F)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3c2 2 4 2.5 6 1.5M9 7c2 2 5 2 7 0"/><circle cx="8" cy="13" r="1.1"/><circle cx="13" cy="12" r="1.1"/><circle cx="10.5" cy="17" r="1.1"/><circle cx="15.5" cy="16.5" r="1.1"/><circle cx="12" cy="21" r="1.1"/></svg><span class="lbl">Feed</span></button>
    </div>
    <span class="sep"></span>
    <div class="grp" role="group" aria-label="Time">

  totalN() {
    const s = this.s, w = s.w, p = s.p, m = s.m;
    let n = w.TAN + w.NO2 + w.NO3 + p.detN + p.soilLab + p.soilRef + p.soilNH4 + (p.foodW + p.foodB) * FOOD_N + p.film * 0.06 + p.phy * 0.07 + p.inf * 0.09;
    n += m.cop * MICRO.cop.mass * 0.09 + m.ost * MICRO.ost.mass * 0.08 + m.worm * MICRO.worm.mass * 0.09;
    for (const pl of s.plants) n += pl.N;
    for (const a of s.animals) { n += this.mass(a) * AN[a.sp].nf + (a.gut || 0) * FOOD_N + (a.eN || 0); }
    for (const c of s.clutches) n += c.n * c.eN;
    if (this.feedAcc) for (let i = 0; i < CLS.length; i++) n += this.feedAcc.N[i];
    return n;
  }

  /* ======================================================================
   * Main integrator. dt in days. opts.bio = max biology step (days).
   * ====================================================================== */
  advance(dt, opts) {
    const bioMax = (opts && opts.bio) || 1 / 144;
    const chemMax = (opts && opts.chem) || 1 / 144;     // 10 tank-minutes by default
    let left = dt;
    while (left > 1e-9) {
      const step = Math.min(left, chemMax, Math.max(1e-6, bioMax - this._bioAcc));
      this.chem(step);
      this.s.t += step * DAY;
      this.s.age += step;
      this._bioAcc += step;
      left -= step;
      if (this._bioAcc >= bioMax - 1e-9) { this.bio(this._bioAcc); this._bioAcc = 0; }
    }
  }

  /* ---------------- water chemistry & fast pools ---------------- */
  chem(dt) {
    const s = this.s, w = s.w, p = s.p;
    const e = this.e = envAt(s.t);
    this.acc.lit += (e.lamp > 0.05 || e.day > 0.15 ? dt : 0); this.acc.litT += dt;
    // temperature
    const lampS = e.lamp;
    const Ttarget = Math.max(TANK.heater + 0.35 * lampS, e.troom + 0.7 + 0.8 * lampS);
    w.T += (Ttarget - w.T) * (1 - Math.exp(-dt / 0.13));
    const fT = this.fT = Math.pow(2, (w.T - 24) / 10);
    const V = w.V;
    const tanC = w.TAN / V, no3C = w.NO3 / V, no2C = w.NO2 / V, o2C = w.O2 / V, co2C = w.CO2 / V;
    const I0 = e.par;
    const F = this._fluxAcc;
    let alk = 0;                                  // alkalinity change, mg CaCO3

    /* plants: photosynthesis & respiration */
    let gross = 0, presp = 0;
    const pl = s.plants;
    for (let i = 0; i < pl.length; i++) {
      const q = pl[i], S = PL[q.sp];
      const I = I0 * q.tau;
      const fC = S.air ? 1 : (co2C + S.hco3) / (co2C + S.hco3 + 2.5);
      const g = S.mu * q.B * (I / (I + S.KI)) * fC * q.fq * fT;
      const rr = S.mu * S.rf * q.B * fT;
      q.acc += (g - rr) * dt;
      if (S.air) presp += rr * 0.2; else { gross += g; presp += rr; }
    }
    // O2 / CO2 from plant metabolism (g DW → mg gas)
    let o2 = gross * 1320 * dt - presp * 1200 * dt;
    let co2 = -gross * 1650 * dt + presp * 1500 * dt;

    /* periphyton (biofilm) & phytoplankton */
    const nAv = tanC + 0.8 * no3C;
    const mN = mm(nAv, 0.015);
    const Iw = I0 * this.cache.surfTau;
    const baseF = (1.3 * p.film * Math.max(0, 1 - p.film / FILM_MAX) * mm(Iw, 30) + 0.4) * fT;   // mg dry/day if N were plentiful
    const baseP = (0.95 * p.phy * mm(I0 * this.cache.waterTau, 70) * this.cache.allelo + 0.015) * fT;
    // epipelic film on the sand also taps ammonium seeping up from the soil
    const soilN = Math.min(p.soilNH4 * 0.02, baseF * 0.06 * (1 - mN) * 0.6);
    const needFilmN = baseF * mN * 0.06, needPhyN = baseP * mm(nAv, 0.12) * 0.07;
    const fixN = baseF * 0.04 * 0.06;                                  // a little N2 fixed by cyanobacteria in the film

    /* nitrifiers */
    const pH = this.pH();
    const pHf = clamp((pH - 5.8) / 1.2, 0.1, 1);
    const rAOB = p.aob * tanC / (0.25 + tanC) * o2C / (0.6 + o2C) * fT * pHf;
    const rNOB = p.nob * no2C / (0.12 + no2C) * o2C / (0.9 + o2C) * fT * pHf;

    /* plant N uptake (aggregated capacities from the last bio step) */
    const Uw = this.cache.Uw * fT, Ur = this.cache.Ur * fT;
    const inhib = 0.08 / (0.08 + tanC);
    let upTAN = Uw * tanC / (0.03 + tanC), upNO3 = Uw * 0.75 * no3C / (0.15 + no3C) * inhib;
    const tanShareF = tanC / (tanC + 0.6 * no3C + 1e-9);
    let fTAN = (needFilmN + needPhyN) * tanShareF, fNO3 = (needFilmN + needPhyN) * (1 - tanShareF);
    // scale demands to what exists
    let dTAN = (upTAN + fTAN + rAOB) * dt;
    const kT = dTAN > 0.9 * w.TAN ? 0.9 * w.TAN / dTAN : 1;
    let dNO3 = (upNO3 + fNO3) * dt;
    const kN = dNO3 > 0.9 * w.NO3 ? 0.9 * w.NO3 / dNO3 : 1;
    upTAN *= kT; fTAN *= kT; const aob = rAOB * kT; upNO3 *= kN; fNO3 *= kN;
    // root uptake from porewater
    let upR = Ur * p.soilNH4 / (p.soilNH4 + 1.2);
    if (upR * dt > 0.9 * p.soilNH4) upR = 0.9 * p.soilNH4 / dt;
    // film/phyto growth limited by the N they could actually get
    const wantFP = needFilmN + needPhyN;
    const fpK = wantFP > 0 ? (fTAN + fNO3) / wantFP : 1;
    const filmN = needFilmN * fpK + fixN + soilN, phyN = needPhyN * fpK;
    p.soilNH4 -= soilN * dt; alk -= 3.57 * soilN * dt;
    const gF = filmN / 0.06, gP = phyN / 0.07;
    p.film += gF * dt; p.phy += gP * dt;
    const phyLoss = p.phy * 0.12 * dt;
    p.phy -= phyLoss; p.detN += phyLoss * 0.07 * 0.6; w.TAN += phyLoss * 0.07 * 0.4;
    const slough = p.film * 0.006 * dt;
    p.film -= slough; p.detN += slough * 0.06;
    // o2/co2 from algae (1 mg dry ≈ 1.3 mg O2)
    o2 += (gF + gP) * 1.3 * dt; co2 -= (gF + gP) * 1.6 * dt;
    s.bal.fix += fixN * dt; s.bal.inN += fixN * dt;

    w.TAN -= (upTAN + fTAN + aob) * dt;
    w.NO3 -= (upNO3 + fNO3) * dt;
    w.NO2 += aob * dt;
    const nob = Math.min(rNOB * dt, w.NO2 * 0.95);
    w.NO2 -= nob; w.NO3 += nob;
    p.soilNH4 -= upR * dt;
    this.acc.upW += (upTAN + upNO3) * dt; this.acc.upR += upR * dt;
    this.acc.upTAN += upTAN * dt; this.acc.upNO3 += upNO3 * dt;
    o2 -= (aob * 3.43 * dt + nob * 1.14);
    alk += -7.14 * aob * dt - 3.57 * (upTAN * dt + upR * dt + fTAN * dt) + 3.57 * (upNO3 + fNO3) * dt;
    // nitrifier biomass follows its workload
    p.aob += (1.5 * aob - 0.05 * p.aob) * dt; p.aob = clamp(p.aob, 4, 4000);
    p.nob += (1.5 * nob / dt - 0.05 * p.nob) * dt; p.nob = clamp(p.nob, 4, 4000);

    /* decomposition of food and detritus */
    const aer = 0.3 + 0.7 * mm(o2C, 1.5);
    const settle = p.foodW * Math.min(1, 20 * dt);
    p.foodW -= settle; p.foodB += settle;
    const decW = p.foodW * (0.25 * fT * dt), decB = p.foodB * Math.min(0.9, 0.3 * fT * aer * dt);
    p.foodW -= decW; p.foodB -= decB;
    const decF = decW + decB;
    const detMin = p.detN * Math.min(0.5, 0.05 * fT * (0.35 + 0.65 * aer) * dt);
    const mts = this.cache.mts || 0;
    const bury = p.detN * Math.min(0.5, 0.006 * (1 + mts / 70) * dt);
    p.detN += decF * FOOD_N * 0.25 - detMin - bury;
    p.soilLab += bury;
    p.soilC += bury * 12;
    const minN = decF * FOOD_N * 0.75 + detMin;
    w.TAN += minN;
    alk += 3.57 * minN;
    o2 -= decF * 0.75 * 1.15 + detMin * 12 * 2.67 * aer;
    co2 += decF * 0.75 * 1.15 * 1.24 + detMin * 12 * 3.67;
    this.rate.decomp = (decF + detMin / 0.03) / dt;
    w.PO4 += decF * FOOD_P * 0.8 + detMin / 7;

    /* animals forage */
    this.feedStep(dt, e.lamp > 0.05 || e.day > 0.15 ? 1 : 0);

    /* soil (Walstad layer) */
    const labM = p.soilLab * 0.0015 * fT * dt, refM = p.soilRef * 0.00005 * fT * dt;
    p.soilLab -= labM; p.soilRef -= refM; p.soilNH4 += labM + refM;
    alk += 3.57 * (labM + refM);
    const cDec = p.soilC * 0.0004 * fT * dt;
    p.soilC -= cDec;
    co2 += cDec * 3.67 * 0.65;
    o2 -= cDec * 0.25 * 2.67 * mm(o2C, 2);
    this.acc.gasBub += cDec * 0.35 + 0;
    const pore = 5.5;                                 // litres of pore water
    const diff = (0.045 * p.soilNH4 - 0.045 * tanC * pore) * dt;
    p.soilNH4 -= diff; w.TAN += diff;
    const cnd = Math.min(p.soilNH4 * 0.012 * fT * dt, p.soilNH4 * 0.5);   // coupled nitrification–denitrification
    p.soilNH4 -= cnd;
    alk -= 3.57 * cnd;
    const den = Math.min(w.NO3 * 0.028 * mm(p.soilC, 15000) * fT * dt, w.NO3 * 0.5);
    w.NO3 -= den;
    alk += 3.57 * den;
    s.bal.outN += cnd + den; s.bal.denit += cnd + den;
    this.acc.gasBub += (cnd + den) * 6;

    /* animal & microfaunal respiration (rate from the last bio step) */
    const ex = this.rate.exN * dt;       // bookkeeping only; excreted N entered the water at the bio step
    o2 -= this.rate.o2 * dt;
    co2 += this.rate.o2 * 1.2 * dt;

    /* phosphate: plant/algal uptake and the soil's iron-bound buffer */
    const pUp = Math.min(((upTAN + upNO3 + upR) / 8 + (filmN + phyN) / 8) * dt, w.PO4 * 0.8);
    w.PO4 -= pUp;
    w.PO4 += (0.03 * V - w.PO4) * (1 - Math.exp(-0.08 * dt));

    /* gases: exchange with room air through the rippled, partly covered surface */
    w.O2 += o2; w.CO2 += co2;
    const open = 1 - 0.85 * this.cache.coverMean;
    const kO2 = 2.8 * (0.5 + 0.5 * open), kCO2 = 1.9 * (0.5 + 0.5 * open);
    const sat = this.o2Sat(w.T), ceq = this.co2Eq(w.T);
    w.O2 += (sat * V - w.O2) * (1 - Math.exp(-kO2 * dt));
    w.CO2 += (ceq * V - w.CO2) * (1 - Math.exp(-kCO2 * dt));
    // supersaturation escapes as pearling bubbles
    const ss = w.O2 / V - sat * 1.12;
    this.acc.pearl = ss > 0 ? ss : 0;
    if (ss > 0) w.O2 -= ss * V * (1 - Math.exp(-6 * dt));
    if (w.O2 < 0.2 * V) w.O2 = 0.2 * V;
    if (w.CO2 < 1.0 * V) w.CO2 = 1.0 * V;     // bicarbonate re-supplies CO2 as plants draw it down

    /* carbonate hardness */
    w.alk += alk;
    w.alk += (TANK.kh0 * 17.86 * V - w.alk) * (1 - Math.exp(-dt / 25));

    /* evaporation and the auto-top-off */
    const E = 0.3 * (1 + 0.06 * (w.T - e.troom)) * (1 - 0.4 * this.cache.coverMean) * (1 + 0.25 * e.lamp) * e.dry;
    w.V -= Math.max(0, E) * dt;
    if (levelOf(w.V) < TANK.full - TANK.ato) {
      const add = TANK.Vfull - w.V;
      w.T = (w.T * w.V + 20.5 * add) / TANK.Vfull;
      w.alk += add * TANK.khTap * 17.86;
      w.O2 += add * 8.6; w.CO2 += add * 2.5;
      w.V = TANK.Vfull;
      s.lastTop = s.age;
      this.event('topoff', { L: add });
    }
    // guard pools
    if (w.TAN < 0) w.TAN = 0; if (w.NO2 < 0) w.NO2 = 0; if (w.NO3 < 0) w.NO3 = 0; if (w.PO4 < 0) w.PO4 = 0;
    if (p.soilNH4 < 0) p.soilNH4 = 0; if (p.detN < 0) p.detN = 0;
    // flux bookkeeping for the cycle view
    F.dt += dt; F.ex += ex; F.min += minN; F.nit += aob * dt; F.nit2 += nob; F.upT += upTAN * dt + fTAN * dt; F.upN += upNO3 * dt + fNO3 * dt;
    F.upR += upR * dt; F.den += cnd + den; F.soil += labM + refM; F.ps += gross * 1320 * dt; F.fix += fixN * dt;
    F.bur += bury;
    if (F.dt >= 0.25) this._closeFlux();
    // history
    if (s.age >= s.nextHist) { this.sampleHist(); s.nextHist = s.age + 1 / 72; }
  }
  _resetFlux() { this._fluxAcc = { dt: 0, ex: 0, min: 0, nit: 0, nit2: 0, upT: 0, upN: 0, upR: 0, den: 0, soil: 0, ps: 0, fix: 0, bur: 0, fed: 0, trim: 0, lit: 0, eg: 0 }; }
  _closeFlux() {
    const F = this._fluxAcc, o = {};
    for (const k in F) if (k !== 'dt') o[k] = F[k] / F.dt;   // per day
    this.flux = o; this._resetFlux();
  }

  o2Sat(T) { return 14.652 - 0.41022 * T + 0.007991 * T * T - 0.000077774 * T * T * T; }
  co2Eq(T) { return 600e-6 * 0.0334 * Math.exp(2400 * (1 / (T + 273.15) - 1 / 298.15)) * 44000; }
  kh() { return this.s.w.alk / (17.86 * this.s.w.V); }
  pH() { const w = this.s.w; const c = Math.max(0.8, w.CO2 / w.V); return clamp(7 - Math.log10(c / (3 * Math.max(0.3, this.kh()))), 5.8, 8.8); }

  /* ---------------- light field: floating cover & canopy ---------------- */
  computeLight() {
    // Light field in two depth zones (front z<15, back z≥15): floating cover per 2-cm column,
    // then leaf canopy per 3.5-cm layer shading everything beneath it.
    const s = this.s, C = this.cache;
    const NB = 38, NY = 12;
    const cover = C.cover, can = C.light;
    cover.fill(0); can.fill(0);
    const level = levelOf(s.w.V);
    const zi = (z) => (z < 15 ? 0 : 1);
    const addCan = (x, z, y0, y1, g) => {
      if (y1 <= y0 || g <= 0) return;
      const i = clamp(Math.floor(x / 2), 0, NB - 1), zb = zi(z) * NB;
      const j0 = clamp(Math.floor((y0 - 3.25) / 3.5), 0, NY - 1), j1 = clamp(Math.floor((y1 - 3.25) / 3.5), 0, NY - 1);
      const per = g / (j1 - j0 + 1);
      for (let j = j0; j <= j1; j++) can[(zb + i) * NY + j] += per;
    };
    const addCover = (x0, x1, z, area) => {
      if (x1 < x0) { const t = x0; x0 = x1; x1 = t; }
      x0 = clamp(x0, 0, 75.99); x1 = clamp(x1, 0, 75.99);
      const i0 = Math.floor(x0 / 2), i1 = Math.floor(x1 / 2), zb = zi(z) * NB;
      const per = area / (i1 - i0 + 1) / (2 * TANK.D / 2);
      for (let i = i0; i <= i1; i++) cover[zb + i] += per;
    };
    let frogB = 0, mossB = 0, stemB = 0, sagB = 0, subB = 0, frogRoot = 0;
    for (const p of s.plants) {
      const S = PL[p.sp];
      const y0 = p.gy == null ? (p.gy = groundY(p.x, p.z)) : p.gy;
      switch (S.type) {
        case 'float':
          for (const q of p.ros) { const rr = this.rosR(q); addCover(q.x - rr, q.x + rr, q.z, Math.PI * rr * rr * 0.92); frogB += q.m; frogRoot += q.root * q.m; }
          break;
        case 'stem': {
          for (const st of p.stems) {
            const base = this.stemBase(p, st);
            const vmax = Math.max(0.5, level - base.y);
            const vert = Math.min(st.L, vmax);
            const leafy0 = base.y + Math.min(st.bare, vert), leafy1 = base.y + vert;
            addCan(base.x, p.z, leafy0, leafy1, (leafy1 - leafy0) * S.rho);
            const fl = st.L - vert;
            if (fl > 0) addCover(base.x, base.x - fl, p.z, fl * 1.0);
            stemB += st.L * S.rho;
          }
          subB += p.B;
          break;
        }
        case 'rib':
          for (const l of p.leaves) {
            const vmax = level - y0, vert = Math.min(l.L, vmax);
            addCan(p.x, p.z, y0 + vert * 0.45, y0 + vert, l.m * (vert / l.L) * 0.55 * 0.5);
            if (l.L > vmax) addCover(p.x, p.x - (l.L - vmax), p.z, (l.L - vmax) * l.w * 0.55);
          }
          subB += p.B;
          break;
        case 'moss': mossB += p.m; subB += p.B; break;
        case 'grs': sagB += p.B; subB += p.B; break;
        default: subB += p.B;
      }
    }
    let cm = 0;
    for (let i = 0; i < 2 * NB; i++) { cover[i] = Math.min(1.3, cover[i]); cm += Math.min(1, cover[i]); }
    C.coverMean = cm / (2 * NB);
    // light transmitted down each column of each zone
    const out = C.lightOut || (C.lightOut = new Float32Array(2 * NB * NY));
    for (let zn = 0; zn < 2; zn++) {
      const zb = zn * NB, ob = (1 - zn) * NB;
      for (let i = 0; i < NB; i++) {
        const x = i * 2 + 1;
        const lampShape = 0.82 + 0.18 * Math.sin(Math.PI * x / TANK.W);
        const c = 0.8 * Math.min(1, cover[zb + i]) + 0.2 * Math.min(1, cover[ob + i]);
        const T = (1 - 0.9 * c) * lampShape;
        let tau = 0;
        for (let j = NY - 1; j >= 0; j--) {
          const y = 5 + j * 3.5, k = (zb + i) * NY + j;
          if (y > level) { out[k] = T; continue; }
          const g = can[k] + 0.25 * can[(ob + i) * NY + j];
          out[k] = T * Math.exp(-0.012 * (level - y) - tau - g * 1.5);
          tau += g * 3;
        }
      }
    }
    let st = 0; for (let i = 0; i < NB; i++) st += (out[i * NY + 6] + out[(NB + i) * NY + 6]) / 2; C.waterTau = st / NB;
    C.surfTau = 0.25 + 0.5 * (1 - C.coverMean);
    C.allelo = 1 / (1 + subB / 14);
    C.refuge = clamp(0.2 + 0.28 * mm(mossB, 2.2) + 0.22 * mm(frogRoot, 25) + 0.18 * mm(stemB, 3) + 0.08 * mm(sagB, 2), 0.2, 0.92);
    C.frogB = frogB; C.mossB = mossB;
    C.ok = true;
    for (const p of s.plants) this.plantTau(p, level);
  }
  lightAt(x, y, z) {
    const i = clamp(Math.floor(x / 2), 0, 37), j = clamp(Math.round((y - 5) / 3.5), 0, 11), zb = (z == null || z >= 15) ? 38 : 0;
    return this.cache.lightOut[(zb + i) * 12 + j];
  }
  coverAt(x) { const i = clamp(Math.floor(x / 2), 0, 37), c = this.cache.cover; return (Math.min(1, c[i]) + Math.min(1, c[38 + i])) / 2; }
  rosR(q) { return 1.1 + 2.3 * Math.sqrt(Math.max(q.m, 0.005) / 0.2); }
  stemBase(p, st) {
    if (st.par < 0 || !p.stems[st.par]) { const x = p.x + (st.s - 0.5) * 8; if (st.gy == null) st.gy = groundY(x, p.z); return { x, y: st.gy }; }
    const par = p.stems[st.par];
    const b = this.stemBase(p, par);
    const level = levelOf(this.s.w.V);
    const vmax = level - b.y;
    const h = Math.min(st.ph, vmax);
    return { x: b.x + par.a * h, y: b.y + h };
  }
  plantTau(p, level) {
    const S = PL[p.sp];
    const y0 = p.gy == null ? (p.gy = groundY(p.x, p.z)) : p.gy;
    switch (S.type) {
      case 'float': {
        let t = 0, n = 0;
        for (const q of p.ros) { const i = clamp(Math.floor(q.x / 2), 0, 37) + (q.z < 15 ? 0 : 38); const c = this.cache.cover[i]; q.tau = 1 - 1.3 * clamp(c - 0.8, 0, 0.5); t += q.tau * q.m; n += q.m; }
        p.tau = n > 0 ? t / n : 1; break;
      }
      case 'stem': {
        let t = 0, n = 0;
        for (const st of p.stems) {
          const b = this.stemBase(p, st), vmax = Math.max(0.5, level - b.y), vert = Math.min(st.L, vmax);
          st.tau = st.L > vmax ? 1 - 0.8 * Math.min(1, this.cache.cover[clamp(Math.floor(b.x / 2), 0, 37) + (p.z < 15 ? 0 : 38)]) : this.lightAt(b.x + st.a * vert, b.y + vert, p.z);
          st.taub = this.lightAt(b.x, b.y + Math.min(st.bare + 1.5, vert), p.z);
          const w = Math.max(0.2, st.L - st.bare);
          t += st.tau * w; n += w;
        }
        p.tau = n > 0 ? t / n : 0.3; break;
      }
      case 'rib': {
        let mL = 0; for (const l of p.leaves) mL += l.L; mL = p.leaves.length ? mL / p.leaves.length : 5;
        p.tau = this.lightAt(p.x, Math.min(level - 1, y0 + 0.75 * mL), p.z); break;
      }
      case 'moss': case 'fern': {
        const a = this.s.anchors[p.an] || [p.x, 15, p.z];
        p.tau = this.lightAt(a[0], a[1] + (S.type === 'fern' ? 6 : 1), a[2]); break;
      }
      default: {
        let mL = 0; for (const l of p.leaves) mL += l.L; mL = p.leaves.length ? mL / p.leaves.length : 3;
        p.tau = this.lightAt(p.x, y0 + 0.6 * mL, p.z);
      }
    }
  }

  /* aggregate uptake capacities for the chem steps */
  aggregate() {

function current(x, y, t) {

  const fy = clamp((y - yb) / H, 0, 1);
  // surface flows left, bottom flows right; strongest near the top
  let u = -Math.cos(Math.PI * fy) * (1.2 + 2.4 * fy * fy) * (0.6 + 0.4 * Math.sin(Math.PI * clamp(x / 76, 0, 1)));
  u += (n2(x * 0.08 + t * 0.07, y * 0.08) - 0.5) * 1.6;
  const v = (n2(x * 0.08 + 13, y * 0.08 - t * 0.05) - 0.5) * 1.1 + (x < 8 ? -0.8 : x > 68 ? 0.8 : 0) * (0.5 + 0.5 * Math.sin(Math.PI * fy));
  return [u, v];
}

/* ======================================================================
 * WebGL light layer: caustics on sand and back glass, shade (multiply)
 * and god rays (additive), computed in world space from the camera.
 * ====================================================================== */
const GL = {

        precision highp float;
        varying vec2 v;
        uniform vec2 res; uniform float camX, eyeY, D, s0, X0, Y0, level, tm, lamp, moon, sandA, sandB;
        uniform sampler2D cov;
        vec3 ray(){ vec2 px = vec2(v.x * res.x, (1.0 - v.y) * res.y); float x0 = camX + (px.x - X0) / s0; float y0 = eyeY - (px.y - Y0) / s0; return vec3(x0, y0, 0.0); }
        float T(float x){ return 1.0 - 0.9 * texture2D(cov, vec2(clamp(x / 76.0, 0.0, 1.0), 0.5)).r; }
        float caus(vec2 w, float t){
          vec2 p = w * 0.23 - 250.0; vec2 i = p; float c = 1.0; float tt;
          tt = t * -2.5;       i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x)); c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / 0.005), p.y / (cos(i.y + tt) / 0.005)));
          tt = t * -0.75;      i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x)); c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / 0.005), p.y / (cos(i.y + tt) / 0.005)));
          tt = t * -0.1666667; i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x)); c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / 0.005), p.y / (cos(i.y + tt) / 0.005)));
          tt = t * 0.125;      i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x)); c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / 0.005), p.y / (cos(i.y + tt) / 0.005)));
          tt = t * 0.25;       i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x)); c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / 0.005), p.y / (cos(i.y + tt) / 0.005)));

          return clamp(pow(abs(c), 8.0), 0.0, 2.0);
        }
        float hash(float n){ return fract(sin(n) * 43758.5453); }
        float noise(float x){ float i = floor(x); float f = fract(x); float u = f * f * (3.0 - 2.0 * f); return mix(hash(i), hash(i + 1.0), u); }
      `;
      // caustics on the sand (and faintly on the back glass)
      const fsC = common + `
        void main(){
          vec3 P0 = ray(); float dx = P0.x - camX, dy = P0.y - eyeY;
          float t = (sandA - sandB * D - eyeY) / (dy - sandB * D);
          float a = 0.0; vec3 col = vec3(1.0, 0.97, 0.86);
          if (t > 0.0) {
            float z = -D + t * D, x = camX + t * dx;
            if (z >= 0.0 && z <= 30.0 && x > 0.0 && x < 76.0) {
              float depth = level - (sandA + sandB * z);
              float c = caus(vec2(x, z * 1.15), tm) * 0.85 + caus(vec2(x * 0.6 + 7.0, z * 0.7 - 3.0), tm * 0.7 + 11.0) * 0.35;
              a = c * T(x - 0.10 * depth) * (0.55 + 0.45 * exp(-z * 0.03));

          }
          float tb = (D + 30.0) / D, xb = camX + tb * dx, yb = eyeY + tb * dy;
          if (a == 0.0 && xb > 0.0 && xb < 76.0 && yb < level && yb > sandA + sandB * 30.0) {

            a = c * 0.28 * T(xb) * smoothstep(sandA + sandB * 30.0, level, yb);

          gl_FragColor = vec4(col * a * lamp, 1.0);

      // light shafts through gaps in the floating plants
      const fsR = common + `
        uniform float surf, bright, pxs, menK; uniform vec4 ph;
        void main(){
          vec3 P0 = ray(); float dx = P0.x - camX, dy = P0.y - eyeY;
          float acc = 0.0;
          for (int k = 0; k < 3; k++) {
            float z = 5.0 + float(k) * 10.0;
            float s = (D + z) / D;
            float x = camX + s * dx, y = eyeY + s * dy;
            float gy = sandA + sandB * z;
            if (y > gy && y < level && x > 0.0 && x < 76.0) {
              float d = level - y;
              float xs = x + 0.16 * d + float(k) * 3.1;
              float band = noise(xs * 0.55 + tm * 0.23 + float(k) * 7.0) * noise(xs * 0.17 - tm * 0.11 + float(k) * 3.0);
              band = smoothstep(0.18, 0.62, band);
              acc += band * T(xs) * exp(-d * 0.045) * (0.35 + 0.65 * smoothstep(0.0, 6.0, y - gy));
            }
          }
          float a = acc * 0.16 * lamp;
          vec3 col = vec3(1.0, 0.98, 0.9) * a;
          if (surf > 0.5 && level > eyeY) {
            // shimmer on the underside of the surface, and the waterline on the front glass. Drawn here, added on
            // top of the shade, exactly as the single-canvas renderer adds them last (units: this canvas's pixels)
            vec2 px = vec2(v.x * res.x, (1.0 - v.y) * res.y);
            float h = level - eyeY;
            float kp = (Y0 - px.y) / h;
            if (kp > 0.0) {
              float zp = s0 * D / kp - D, xp = camX + (px.x - X0) / kp;
              if (zp >= 0.0 && zp <= 30.0 && xp >= 0.0 && xp <= 76.0) {
                float fi = zp / 30.0 * 26.0 - 0.5;
                float sh = 0.0;
                for (int j = -2; j <= 2; j++) {
                  float i = floor(fi + 0.5) + float(j);
                  if (i < 0.0 || i > 25.0) continue;
                  float zi = (i + 0.5) / 26.0 * 30.0, ki = s0 * D / (D + zi);
                  float xi = camX + (px.x - X0) / ki;
                  float w = sin(xi * 0.7 + ph.x + i * 1.7) * 0.35 + sin(xi * 0.23 - ph.y + i) * 0.5;
                  float yi = Y0 - h * ki + w * ki * 0.25;
                  float hw = max(0.5 * pxs, ki * 0.08) * 0.5;
                  float cov = clamp(hw + 0.5 - abs(px.y - yi), 0.0, 1.0);
                  sh += cov * 0.05 * bright * (0.4 + 0.6 * (1.0 - zi / 30.0));
                }
                col += vec3(1.0, 1.0, 0.94) * sh;
              }
            }
            float xm = camX + (px.x - X0) / s0;
            if (xm >= 0.0 && xm <= 76.0) {
              float amp = 0.04 + 0.12 * smoothstep(50.0, 74.0, xm);
              float ym = Y0 - (h + sin(xm * 1.3 + ph.z) * amp + sin(xm * 0.4 - ph.w) * amp * 0.6) * s0;
              float hw = max(pxs, s0 * 0.06) * 0.5;
              float cov = clamp(hw + 0.5 - abs(px.y - ym), 0.0, 1.0);
              col += vec3(0.863, 0.941, 0.902) * cov * (0.25 + 0.4 * bright) * menK;
            }
          }
          gl_FragColor = vec4(col, 1.0);
        }`;
      // shade: floating cover, depth and time of day (multiply)
      const fsS = common + `
        uniform vec3 tint; uniform float vign;
        void main(){
          vec3 P0 = ray(); float dx = P0.x - camX, dy = P0.y - eyeY;
          float s = (D + 14.0) / D; float x = camX + s * dx, y = eyeY + s * dy;
          float d = clamp(level - y, 0.0, 40.0);
          float sp = 1.0 + d * 0.22, xc = x + 0.12 * d;
          float cv = (texture2D(cov, vec2(clamp((xc - sp) / 76.0, 0.0, 1.0), 0.5)).r + texture2D(cov, vec2(clamp(xc / 76.0, 0.0, 1.0), 0.5)).r * 2.0 + texture2D(cov, vec2(clamp((xc + sp) / 76.0, 0.0, 1.0), 0.5)).r) * 0.25;
          float lit = mix(1.0, 0.6, cv);
          lit *= mix(1.0, 0.78, smoothstep(0.0, 34.0, d));
          lit = mix(1.0, lit, lamp);
          vec2 q = v - 0.5; float vg = 1.0 - vign * dot(q, q) * 1.6;
          gl_FragColor = vec4(tint * lit * vg, 1.0);
        }`;
      const fsrc = { c: fsC, r: fsR, s: fsS };
      const mk = (gl, fs) => {
        const p = gl.createProgram();
        for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
          const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh);

          gl.attachShader(p, sh);
        }
        gl.bindAttribLocation(p, 0, 'p'); gl.linkProgram(p);
        if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));

        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

      };
      if (this.layered) {

      } else {
        make(['c', 'r', 's'], { premultipliedAlpha: false, preserveDrawingBuffer: true, antialias: false, alpha: true }, 1, null);
        this.cv = this.ctxs[0].cv;
      }
      this.covData = new Uint8Array(64); this.covV++;
      this.ok = true;
    } catch (e) { this.ok = false; this.ctxs = []; this.by = {}; if (typeof console !== 'undefined') console.warn('light layer off:', e.message); }
  },
  canvases() { return this.ctxs.map((X) => X.cv); },
  size(w, h) {
    for (const X of this.ctxs) { X.w = Math.max(32, Math.round(w * X.scale)); X.h = Math.max(32, Math.round(h * X.scale)); X.cv.width = X.w; X.cv.height = X.h; }
    this.shadeKey = '';
  },
  setCover(arr) {
    if (!this.ok) return;
    const d = this.covData, nd = this._nd || (this._nd = new Uint8Array(64));
    let same = true;
    for (let i = 0; i < 64; i++) { const x = (i + 0.5) / 64 * 76; nd[i] = Math.round(255 * clamp(arr(x), 0, 1)); if (nd[i] !== d[i]) same = false; }
    if (same && this.covV > 1) return;
    d.set(nd); this.covV++;
    for (const X of this.ctxs) {
      const gl = X.gl;
      gl.bindTexture(gl.TEXTURE_2D, X.tex);
      gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, 64, 1, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, d);

  },
  draw(which, U) {
    const X = this.by[which], gl = X.gl, pr = X.prog[which];
    gl.viewport(0, 0, X.w, X.h);
    gl.useProgram(pr.p);
    const f = X.w / V.W;
    const c = V.cam;
    const set1 = (n, v) => { if (pr.u[n]) gl.uniform1f(pr.u[n], v); };
    gl.uniform2f(pr.u.res, X.w, X.h);
    set1('camX', c.camX); set1('eyeY', c.eyeY); set1('D', c.D); set1('s0', c.s0 * f); set1('X0', c.X0 * f); set1('Y0', c.Y0 * f);
    set1('level', U.level); set1('tm', U.tm); set1('lamp', U.lamp); set1('moon', U.moon); set1('sandA', TANK.sandF); set1('sandB', (TANK.sandB - TANK.sandF) / 30);
    if (pr.u.tint) gl.uniform3f(pr.u.tint, U.tint[0], U.tint[1], U.tint[2]);
    if (pr.u.surf) { gl.uniform1f(pr.u.surf, this.layered ? 1 : 0); set1('bright', U.bright); set1('pxs', f); set1('menK', 0.95); gl.uniform4f(pr.u.ph, U.ph[0], U.ph[1], U.ph[2], U.ph[3]); }
    if (pr.u.vign) gl.uniform1f(pr.u.vign, U.vign);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, X.tex); if (pr.u.cov) gl.uniform1i(pr.u.cov, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    return X.cv;
  },
  // the shade changes only with the light, the water level and the floating cover: redraw it when they do
  shade(U) {
    const q = (v, k) => Math.round(v * k);
    const key = [q(U.level, 200), q(U.lamp, 400), q(U.tint[0], 600), q(U.tint[1], 600), q(U.tint[2], 600), U.vign, q(V.cam.camX, 1000), this.covV, V.W, V.H].join(',');
    if (key === this.shadeKey) return false;
    this.shadeKey = key;
    this.draw('s', U);
    return true;
  },
};

/* ======================================================================
 * Static caches (rebuilt on resize / pan)
 * ====================================================================== */
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }

// sand texture tile (top-down, 1 px ≈ 0.05 cm at 256 px for 12.8 cm)
function sandTile() {
  const S = 256, c = makeCanvas(S, S), g = c.getContext('2d');
  const img = g.createImageData(S, S), d = img.data;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const i = (y * S + x) * 4;
    const fine = rnd();
    const blotch = n2(x * 0.03, y * 0.03);
    let l = 0.72 + 0.2 * blotch + (fine - 0.5) * 0.28;
    const hue = rnd();
    let r = 200, gg = 180, b = 146;
    if (hue < 0.06) { r = 120; gg = 104; b = 88; } else if (hue < 0.1) { r = 225; gg = 214; b = 190; } else if (hue < 0.13) { r = 170; gg = 128; b = 96; }
    d[i] = r * l; d[i + 1] = gg * l; d[i + 2] = b * l; d[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  // pebbles
  for (let k = 0; k < 70; k++) {
    const x = rr(0, S), y = rr(0, S), rx = rr(1.5, 5.5), ry = rx * rr(0.6, 1);
    const l = rr(0.45, 1);
    const tint = rnd() < 0.3 ? [150, 118, 90] : rnd() < 0.5 ? [205, 196, 178] : [132, 124, 112];
    const gr = g.createRadialGradient(x - rx * 0.3, y - ry * 0.3, 0.5, x, y, rx);
    gr.addColorStop(0, rgba(tint.map((v) => Math.min(255, v * l * 1.25)), 1));
    gr.addColorStop(1, rgba(tint.map((v) => v * l * 0.55), 1));
    g.fillStyle = gr; g.beginPath(); g.ellipse(x, y, rx, ry, rr(0, 3), 0, TAU); g.fill();
  }
  return c;
}

// the substrate as seen through the front glass: sloping sand plane + soil cross-section
function buildSubstrate() {
  const W = V.W, H = V.H, d = V.dpr;
  const c = V.caches.sub = makeCanvas(W * d, H * d);
  V.subV = (V.subV || 0) + 1;
  const g = c.getContext('2d');
  const tile = V.caches.sandTile || (V.caches.sandTile = sandTile());
  const pat = g.createPattern(tile, 'repeat');
  // sand plane, strips from back to front
  const dz = 0.5;
  for (let z = 30; z > 0; z -= dz) {
    const z0 = z - dz, k0 = kz(z0), k1 = kz(z);
    g.save();
    g.beginPath();
    for (let x = -1; x <= 77; x += 1.5) { const X = sx(x, z) * d, Y = sy(groundY(clamp(x, 0, 76), z), z) * d; x === -1 ? g.moveTo(X, Y) : g.lineTo(X, Y); }
    for (let x = 77; x >= -1; x -= 1.5) g.lineTo(sx(x, z0) * d, sy(groundY(clamp(x, 0, 76), z0), z0) * d + 1);
    g.closePath(); g.clip();
    // pattern in world units: 256px tile = 12.8 cm; foreshortened vertically
    const kk = (k0 + k1) / 2;
    const yTop = sy(groundY(38, z), z), yBot = sy(groundY(38, z0), z0);
    const fore = Math.max(0.05, (yBot - yTop) / (dz * kk));
    const m = new DOMMatrix();
    const scl = 12.8 / 256 * kk * d;
    m.translateSelf((V.cam.X0 - V.cam.camX * kk) * d, yTop * d - z * 20 * scl * fore);
    m.scaleSelf(scl, scl * fore);
    pat.setTransform(m);
    g.fillStyle = pat;
    const bT = Math.min(sy(groundY(20, z), z), sy(groundY(60, z), z), yTop) - 3, bB = yBot + 3;
    g.fillRect(0, bT * d, W * d, (bB - bT) * d);
    // depth: far sand is dimmer and bluer
    const f = z / 30;
    g.fillStyle = `rgba(20,52,56,${0.08 + 0.42 * f})`;
    g.fillRect(0, bT * d, W * d, (bB - bT) * d);
    g.restore();
  }
  // soil + sand cross-section at the front glass
  const yS = (y) => sy(y, 0) * d;
  g.save();
  g.beginPath();
  g.moveTo(sx(-2, 0) * d, yS(0));
  for (let x = -2; x <= 78; x += 1) g.lineTo(sx(x, 0) * d, yS(groundY(clamp(x, 0, 76), 0)));
  g.lineTo(sx(78, 0) * d, yS(0)); g.closePath(); g.clip();
  // sand layer
  const m2 = new DOMMatrix(); const s2 = 12.8 / 256 * V.cam.s0 * d * 0.8;
  m2.translateSelf((V.cam.X0 - V.cam.camX * V.cam.s0) * d, 0); m2.scaleSelf(s2, s2); pat.setTransform(m2);
  g.fillStyle = pat; g.fillRect(0, 0, W * d, H * d);
  g.fillStyle = 'rgba(40,30,20,0.18)'; g.fillRect(0, 0, W * d, H * d);
  // soil layer (dark organic), with a ragged boundary
  g.beginPath();
  g.moveTo(sx(-2, 0) * d, yS(-1));
  for (let x = -2; x <= 78; x += 0.7) g.lineTo(sx(x, 0) * d, yS(TANK.soil + (n1(x * 0.9) - 0.5) * 0.7 + (n1(x * 3.1 + 5) - 0.5) * 0.25));
  g.lineTo(sx(78, 0) * d, yS(-1)); g.closePath();
  const sg = g.createLinearGradient(0, yS(TANK.soil + 0.5), 0, yS(0));
  sg.addColorStop(0, '#3e2d1e'); sg.addColorStop(0.6, '#2c1f14'); sg.addColorStop(1, '#1d140d');
  g.fillStyle = sg; g.fill();
  // fibres and grit in the soil
  g.save(); g.clip();
  for (let i = 0; i < 900; i++) {
    const x = rr(-2, 78), y = rr(0, TANK.soil + 0.4);
    g.strokeStyle = rnd() < 0.6 ? `rgba(90,64,40,${rr(0.2, 0.6)})` : `rgba(20,12,6,${rr(0.3, 0.7)})`;
    g.lineWidth = rr(0.4, 1.2) * d;
    const a = rr(0, TAU), L = rr(0.1, 0.5);
    g.beginPath(); g.moveTo(sx(x, 0) * d, yS(y)); g.lineTo(sx(x + Math.cos(a) * L, 0) * d, yS(y + Math.sin(a) * L * 0.5)); g.stroke();
  }

/* ---------------- rosettes: crypts, sagittaria, java fern ---------------- */
function leafBlade(ctx, bx, by, ang, L, w, wavy, t, seed, droop, shape) {
  // blade from (bx, by) starting at angle ang, curving by droop (radians over its length)
  const N = 10, dr = droop || 0, sh = shape || 0.8;
  const cx = V._bx || (V._bx = new Float64Array(22)), cy = V._by || (V._by = new Float64Array(22)), cn = V._bn || (V._bn = new Float64Array(44));
  let x = bx, y = by, a = ang;
  for (let k = 0; k <= N; k++) {
    if (k > 0) { a += dr / N; x += Math.cos(a) * L / N; y += Math.sin(a) * L / N; }
    cx[k] = x; cy[k] = y; cn[k * 2] = -Math.sin(a); cn[k * 2 + 1] = Math.cos(a);
  }
  ctx.moveTo(bx, by);
  for (let k = 1; k <= N; k++) {
    const f = k / N, wf = Math.sin(Math.PI * Math.pow(f, sh)) * w * 0.5 * (1 + (wavy ? Math.sin(f * 22 + seed * 9) * 0.1 : 0));
    ctx.lineTo(cx[k] + cn[k * 2] * wf, cy[k] + cn[k * 2 + 1] * wf);
  }
  for (let k = N - 1; k >= 1; k--) {
    const f = k / N, wf = Math.sin(Math.PI * Math.pow(f, sh)) * w * 0.5 * (1 + (wavy ? Math.sin(f * 22 + seed * 5 + 2) * 0.1 : 0));
    ctx.lineTo(cx[k] - cn[k * 2] * wf, cy[k] - cn[k * 2 + 1] * wf);
  }
  ctx.closePath();
  return [cx[N], cy[N]];
}
function drawCrypt(ctx, p) {
  setWorld(ctx, p.z);
  const y0 = p.gy != null ? p.gy : (p.gy = groundY(p.x, p.z)), L = p.leaves;
  const pts = p._pts || (p._pts = []); pts.length = 0;
  for (let i = 0; i < L.length; i++) {
    const l = L[i];
    if (l.L < 0.5) continue;
    const ageF = l.age / l.life;
    const ang = Math.PI / 2 + l.a * 1.1 + swayAt(p.x, y0 + l.L, 1, 0.05, l.s);
    const pet = l.L * 0.35, blade = l.L * 0.65;

    ctx.strokeStyle = 'rgba(96,66,44,0.9)'; ctx.lineWidth = 0.12;

    ctx.strokeStyle = back ? 'rgba(170,80,60,0.45)' : hsl(20, 0.35, 0.36, 0.5); ctx.lineWidth = 0.07;
    ctx.beginPath(); leafBlade(ctx, bx, by, ang, blade * 0.92, 0.001, false, 0, 0, dro, 0.62); ctx.stroke();

}
function drawSag(ctx, p) {

}

/* ---------------- java moss ---------------- */
function mossSprite() {
  const S = 160, c = View.makeCanvas(S, S), g = c.getContext('2d');
  g.lineCap = 'round';
  for (let i = 0; i < 1400; i++) {
    const a = Math.random() * TAU, r = Math.pow(Math.random(), 0.6) * S * 0.42;
    const x = S / 2 + Math.cos(a) * r, y = S / 2 + Math.sin(a) * r * 0.8;
    const L = 3 + Math.random() * 9, d = a + (Math.random() - 0.5) * 1.6;
    const l = 0.18 + Math.random() * 0.2;
    g.strokeStyle = hsl(95 + Math.random() * 25, 0.4 + Math.random() * 0.2, l, 0.85);
    g.lineWidth = 0.6 + Math.random() * 0.9;
    g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x + Math.cos(d) * L * 0.6 + (Math.random() - 0.5) * 3, y + Math.sin(d) * L * 0.6, x + Math.cos(d) * L, y + Math.sin(d) * L);

}
function drawMoss(ctx, p) {

/* ---------------- Amazon frogbit ---------------- */
function drawFrog(ctx, p, part) {
  // part: 'roots' (drawn in depth order) or 'leaves' (the floating mat, drawn with the surface)
  const level = V.level, R = p.ros;
  const pts = p._pts || (p._pts = []); if (part === 'leaves') pts.length = 0;
  for (let i = 0; i < R.length; i++) {
    const q = R[i];
    const z = q.z, k = kz(z);
    const drift = Math.sin(V.t * 0.12 + q.s * 20) * 0.6;
    const x = q.x + drift;
    if (part === 'roots') {
      setWorld(ctx, z);
      const nR = 2 + Math.round(q.s * 4);
      ctx.strokeStyle = 'rgba(210,222,196,0.22)'; ctx.lineWidth = 0.045;
      ctx.beginPath();
      for (let j = 0; j < nR; j++) {
        const rl = q.root * (0.35 + 0.65 * ((j * 0.37 + q.s * 3.1) % 1));
        const ox = x + (j - nR / 2) * 0.35;
        let px = ox, py = level - 0.3;
        ctx.moveTo(px, py);
        for (let s = 1; s <= 6; s++) {
          const f = s / 6;
          const c = current(ox, level - rl * f, V.t);
          px = ox + c[0] * 0.5 * f * f * rl * 0.12 + Math.sin(V.t * 0.8 + j + q.s * 7 + f * 3) * 0.3 * f;
          py = level - 0.3 - rl * f;
          ctx.lineTo(px, py);
        }
      }
      ctx.stroke();
      // feathery root hairs
      ctx.strokeStyle = 'rgba(214,224,200,0.09)'; ctx.lineWidth = 0.03;
      ctx.beginPath();
      for (let j = 0; j < nR; j += 2) {
        const rl = q.root * (0.35 + 0.65 * ((j * 0.37 + q.s * 3.1) % 1)), ox = x + (j - nR / 2) * 0.35;
        for (let s = 1; s < 6; s++) { const yy = level - 0.3 - rl * s / 6, xx = ox + Math.sin(V.t * 0.8 + j + q.s * 7 + s / 2) * 0.3 * s / 6; ctx.moveTo(xx, yy); ctx.lineTo(xx - 0.35, yy - 0.25); ctx.moveTo(xx, yy); ctx.lineTo(xx + 0.35, yy - 0.25); }
      }
      ctx.stroke();
    } else {
      // leaves seen from below, pressed against the silvery underside of the surface
      setScreen(ctx);
      const nL = clamp(Math.round(2 + q.m / 0.03), 2, 8);
      const lr = 0.9 + 1.4 * Math.sqrt(Math.max(q.m, 0.01) / 0.2);
      for (let j = 0; j < nL; j++) {
        const a = j / nL * TAU + q.s * 6;
        const lx = x + Math.cos(a) * lr * 0.75, lz = clamp(z + Math.sin(a) * lr * 0.75, 0.2, 29.8);
        const X = sx(lx, lz), Y = sy(level, lz);
        const kk = kz(lz);
        const fore = Math.max(0.12, Math.abs(sy(level, lz + 1) - sy(level, lz)) / kk);
        ctx.fillStyle = `rgba(${40 + 30 * V.L.bright | 0},${70 + 60 * V.L.bright | 0},${36 + 30 * V.L.bright | 0},0.92)`;
        ctx.beginPath(); ctx.ellipse(X, Y + lr * kk * fore * 0.1, lr * kk * 0.62, Math.max(1, lr * kk * fore * 0.62), 0, 0, TAU); ctx.fill();
        ctx.fillStyle = `rgba(160,210,120,${0.25 * V.L.bright})`;
        ctx.beginPath(); ctx.ellipse(X, Y, lr * kk * 0.45, Math.max(0.6, lr * kk * fore * 0.4), 0, 0, TAU); ctx.fill();
      }
      pts.push(x, level);
    }
  }
}

/* ---------------- driftwood & stones ---------------- */
function drawWood(ctx, b) {
  setWorld(ctx, b.z);
  const P = b.pts;
  ctx.fillStyle = '#3a2a1c';
  ctx.beginPath();
  const left = [], right = [];
  for (let i = 0; i < P.length; i++) {
    const a = P[Math.max(0, i - 1)], c = P[Math.min(P.length - 1, i + 1)];
    const dx = c[0] - a[0], dy = c[1] - a[1], dl = Math.hypot(dx, dy) || 1;
    const nx = -dy / dl, ny = dx / dl, r = P[i][3];
    left.push(P[i][0] + nx * r, P[i][1] + ny * r); right.push(P[i][0] - nx * r, P[i][1] - ny * r);
  }
  ctx.moveTo(left[0], left[1]);
  for (let k = 2; k < left.length; k += 2) ctx.lineTo(left[k], left[k + 1]);
  const e = P[P.length - 1];
  ctx.quadraticCurveTo(e[0] + (e[0] - P[P.length - 2][0]) * 0.4, e[1] + (e[1] - P[P.length - 2][1]) * 0.4, right[right.length - 2], right[right.length - 1]);
  for (let k = right.length - 4; k >= 0; k -= 2) ctx.lineTo(right[k], right[k + 1]);
  ctx.closePath();
  const g = ctx.createLinearGradient(P[0][0] - 3, P[0][1] + 3, P[0][0] + 3, P[0][1] - 3);
  g.addColorStop(0, '#5a4330'); g.addColorStop(0.5, '#3b2a1c'); g.addColorStop(1, '#22170f');
  ctx.fillStyle = g; ctx.fill();
  // bark grain
  ctx.strokeStyle = 'rgba(20,12,6,0.45)'; ctx.lineWidth = 0.07;
  ctx.beginPath();
  for (let j = -1; j <= 1; j++) {
    for (let i = 0; i < P.length; i++) {
      const a = P[Math.max(0, i - 1)], c = P[Math.min(P.length - 1, i + 1)];
      const dx = c[0] - a[0], dy = c[1] - a[1], dl = Math.hypot(dx, dy) || 1;
      const x = P[i][0] - dy / dl * P[i][3] * j * 0.5, y = P[i][1] + dx / dl * P[i][3] * j * 0.5;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
  }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(200,170,130,0.12)'; ctx.lineWidth = 0.12;
  ctx.beginPath();
  for (let i = 0; i < P.length; i++) { const x = P[i][0] - 0.2, y = P[i][1] + P[i][3] * 0.55; i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
  ctx.stroke();
}

  if (k === 'cop') return { x: rr(3, 73), y: rr(8, V.level - 3), z: rr(1, 29), vx: 0, vy: 0, t: rr(0, 2) };
  if (k === 'ost') { const s = Math.random(); const surf = s < 0.5 ? 'sand' : s < 0.8 ? 'fg' : 'bg'; const x = rr(3, 73), z = surf === 'fg' ? 0.3 : surf === 'bg' ? 29.7 : rr(1, 28); return { surf, x, z, y: surf === 'sand' ? groundY(x, z) + 0.03 : rr(TANK.sandF + 0.3, 14), hd: rr(0, TAU) }; }

/* ======================================================================
 * Drawing
 * ====================================================================== */
const ENC = { o: [255, 110, 30], k: [20, 16, 14], g: [60, 220, 170], b: [70, 150, 255], y: [255, 214, 60] };

function fishFrame(ctx, ag) {
  // world transform for a fish: position, facing, foreshortening and pitch
  const z = ag.z;
  setWorld(ctx, z);
  const cx = Math.cos(ag.yaw);
  const facing = cx >= 0 ? 1 : -1;
  const fore = 0.3 + 0.7 * Math.abs(cx);
  ctx.translate(ag.x, ag.y);
  ctx.rotate(ag.pitch * facing * fore);
  const L = ag.a.L;
  ctx.scale(facing * fore * L, L);
  return fore;
}
function bodyPath(ctx, H, belly, ph, amp, snout) {
  // unit fish body from snout (+0.5) to peduncle (-0.36); returns tail offset
  const bend = (x) => amp * (0.5 - x) * (0.5 - x) * Math.sin(ph - x * 7);
  const s = snout || 0;
  ctx.beginPath();
  ctx.moveTo(0.5, 0.005 + bend(0.5));
  ctx.bezierCurveTo(0.46, 0.08 + s + bend(0.46), 0.28, H + bend(0.28), 0.05, H * 1.02 + bend(0.05));
  ctx.bezierCurveTo(-0.16, H * 0.95 + bend(-0.16), -0.3, 0.06 + bend(-0.3), -0.37, 0.045 + bend(-0.37));
  ctx.lineTo(-0.37, -0.04 + bend(-0.37));
  ctx.bezierCurveTo(-0.28, -0.06 + bend(-0.28), -0.1, -H * belly + bend(-0.1), 0.12, -H * belly * 0.98 + bend(0.12));
  ctx.bezierCurveTo(0.3, -H * belly * 0.9 + bend(0.3), 0.44, -0.07 + bend(0.44), 0.5, -0.01 + bend(0.5));
  ctx.closePath();
  return bend;
}
function tailPath(ctx, bend, spread, fork, len, round) {
  const y0 = bend(-0.37), yt = bend(-0.37 - len) * 1.25;
  ctx.beginPath();
  ctx.moveTo(-0.35, 0.04 + y0);
  if (round) {
    ctx.bezierCurveTo(-0.45, 0.06 + y0, -0.37 - len, spread + yt, -0.37 - len * 1.02, spread * 0.3 + yt);
    ctx.bezierCurveTo(-0.37 - len * 1.06, -spread * 0.3 + yt, -0.37 - len, -spread + yt, -0.45, -0.06 + y0);
  } else {
    ctx.lineTo(-0.37 - len, spread + yt);
    ctx.quadraticCurveTo(-0.37 - len * (1 - fork), yt, -0.37 - len, -spread + yt);
  }
  ctx.lineTo(-0.35, -0.04 + y0);
  ctx.closePath();
}
function eye(ctx, x, y, r, iris) {
  ctx.fillStyle = iris || 'rgba(150,150,128,0.85)'; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(6,6,6,0.96)'; ctx.beginPath(); ctx.arc(x + r * 0.06, y - r * 0.02, r * 0.72, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc(x + r * 0.3, y + r * 0.3, r * 0.17, 0, TAU); ctx.fill();
}
function finPath(ctx, pts) { ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); }

function drawEmber(ctx, ag) {
  const a = ag.a, g = a.g;
  fishFrame(ctx, ag);
  const night = V.L.night;
  const fem = a.sex === 0;
  const H = (fem ? 0.158 : 0.145) * (g.dp || 1), amp = 0.03 + Math.min(0.05, ag.spd * 0.004);
  const rd = g.rd || 0.8;
  const hue = 10 + (1 - rd) * 18, sat = (0.62 + 0.3 * rd) * (1 - night * 0.55), lig = (fem ? 0.55 : 0.5) + (1 - rd) * 0.08;
  const juv = clamp((a.L - 0.4) / 1.2, 0, 1);
  const bend = bodyPath(ctx, H, 1.08, ag.ph, amp);
  // translucent fins, tinted like the body
  ctx.fillStyle = hsl(hue, sat * 0.8, lig + 0.05, 0.3 * (0.4 + 0.6 * juv));
  tailPath(ctx, bend, 0.13, 0.55, 0.17, false); ctx.fill();
  finPath(ctx, [0.0, H * 0.92 + bend(0), -0.14, H * 1.62 + bend(-0.14), -0.2, H * 0.82 + bend(-0.2)]); ctx.fill();          // dorsal
  finPath(ctx, [-0.02, -H * 0.95 + bend(-0.02), -0.2, -H * 1.45 + bend(-0.2), -0.3, -H * 0.55 + bend(-0.3)]); ctx.fill();   // anal

  ctx.strokeStyle = hsl(hue - 4, sat, lig * 0.6, 0.45 * juv); ctx.lineWidth = 0.012;
  ctx.beginPath(); ctx.moveTo(0.0, H * 0.92 + bend(0)); ctx.lineTo(-0.14, H * 1.62 + bend(-0.14)); ctx.moveTo(-0.02, -H * 0.95 + bend(-0.02)); ctx.lineTo(-0.2, -H * 1.45 + bend(-0.2)); ctx.stroke();
  // body: glassy orange-red, deeper on the back
  bodyPath(ctx, H, 1.08, ag.ph, amp);
  const gr = ctx.createLinearGradient(0, H, 0, -H);
  gr.addColorStop(0, hsl(hue + 2, sat, lig * 0.86, 0.92)); gr.addColorStop(0.5, hsl(hue + 4, sat, lig + 0.06, 0.86)); gr.addColorStop(1, hsl(hue + 12, sat * 0.75, lig + 0.2, 0.8));
  ctx.fillStyle = gr; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = `rgba(110,30,15,${0.16 * juv})`; ctx.beginPath(); ctx.ellipse(0.1, -0.03, 0.13, 0.045, 0, 0, TAU); ctx.fill();      // gut shadow through the flank
  const sg = ctx.createLinearGradient(0, H * 0.45, 0, -H * 0.05);
  sg.addColorStop(0, 'rgba(255,225,200,0)'); sg.addColorStop(0.5, `rgba(255,225,200,${0.1 * (1 - night)})`); sg.addColorStop(1, 'rgba(255,225,200,0)');
  ctx.fillStyle = sg; ctx.fillRect(-0.4, -H * 0.05, 0.9, H * 0.5);                                                                     // sheen along the flank
  ctx.restore();
  eye(ctx, 0.37, 0.025, 0.043, hsl(8, 0.7, 0.42, 0.9));
}

function drawEndler(ctx, ag) {
  const a = ag.a, g = a.g;
  fishFrame(ctx, ag);
  const night = V.L.night, fade = 1 - night * 0.45;
  const male = a.sex === 1;
  const juv = clamp((a.L - 0.75) / 1.1, 0, 1);
  const preg = !male && a.pr >= 0 ? clamp(a.pr / 24, 0, 1) : 0;
  const H = male ? 0.118 : 0.138 + preg * 0.012, belly = male ? 1.0 : 1.1 + preg * 0.2;
  const amp = 0.035 + Math.min(0.05, ag.spd * 0.004) + (ag.display ? 0.07 : 0);
  const coloured = male && g.y && juv > 0.4;
  const cj = coloured ? clamp((juv - 0.4) / 0.4, 0, 1) : 0;
  const bend = bodyPath(ctx, H, belly, ag.ph, amp);
  if (coloured) {
    // the male's tail: orange with black upper and lower margins, sometimes drawn out into swords
    const tl = 0.24 * (g.fn || 1), sp = 0.14 * (g.fn || 1);
    const yt = bend(-0.37 - tl) * 1.25;
    const o = 0.55 + 0.45 * g.o;
    const sw = g.y.sw;
    const kA = (0.35 + 0.6 * g.k) * fade * cj;
    const sword = (sg) => {
      ctx.beginPath(); ctx.moveTo(-0.37 - tl * 0.55, sg * sp * 0.78 + yt); ctx.lineTo(-0.37 - tl * 1.45, sg * sp * 0.86 + yt * 1.3); ctx.lineTo(-0.37 - tl * 0.8, sg * sp * 0.6 + yt); ctx.closePath();
      ctx.fillStyle = rgba([255 * o, 116 * o + 12, 26], 0.85 * fade * cj); ctx.fill();
      ctx.strokeStyle = `rgba(12,10,8,${kA})`; ctx.lineWidth = 0.012; ctx.stroke();
    };
    if (sw === 1 || sw === 2) sword(-1);
    if (sw === 2 || sw === 3) sword(1);
    tailPath(ctx, bend, sp, 0.12, tl, true);
    ctx.fillStyle = rgba([255 * o, 112 * o + 20, 30], (0.6 + 0.35 * g.o) * fade * cj + 0.25 * (1 - cj)); ctx.fill();
    ctx.save(); ctx.clip();
    ctx.fillStyle = `rgba(12,10,8,${kA})`;
    ctx.fillRect(-0.37 - tl * 1.2, yt + sp * 0.62, tl * 1.3, sp);
    ctx.fillRect(-0.37 - tl * 1.2, yt - sp * 0.62 - sp, tl * 1.3, sp);
    ctx.fillStyle = rgba([255, 190, 90], 0.25 * g.o * fade * cj);
    ctx.beginPath(); ctx.ellipse(-0.37 - tl * 0.45, yt * 0.6, tl * 0.3, sp * 0.3, 0, 0, TAU); ctx.fill();

    finPath(ctx, [0.04, H * 0.95 + bend(0.04), -0.08, dh + bend(-0.08), -0.24, H * 1.2 + bend(-0.24), -0.22, H * 0.85 + bend(-0.22)]); ctx.fill();
    ctx.strokeStyle = rgba(ENC.o, 0.6 * g.o * fade * cj); ctx.lineWidth = 0.014;
    ctx.beginPath(); ctx.moveTo(0.04, H * 0.95 + bend(0.04)); ctx.lineTo(-0.08, dh + bend(-0.08)); ctx.stroke();
    // gonopodium
    ctx.strokeStyle = `rgba(60,55,45,${0.5 * cj})`; ctx.lineWidth = 0.018;
    ctx.beginPath(); ctx.moveTo(-0.02, -H * 0.9 + bend(-0.02)); ctx.lineTo(-0.16, -H * 1.35 + bend(-0.16)); ctx.stroke();
  } else {
    ctx.fillStyle = `rgba(205,205,190,${0.26 * fade})`;
    tailPath(ctx, bend, 0.12, 0.1, 0.19, true); ctx.fill();
    if (!male && g.o > 0.75) { ctx.fillStyle = `rgba(255,140,40,${0.1 * (g.o - 0.7) * 3})`; ctx.fill(); }
    ctx.fillStyle = `rgba(200,200,185,${0.22 * fade})`;
    finPath(ctx, [0.02, H * 0.95 + bend(0.02), -0.1, H * 1.6 + bend(-0.1), -0.2, H * 0.9 + bend(-0.2)]); ctx.fill();
  }
  // body: olive back, silvery flanks, pale belly
  bodyPath(ctx, H, belly, ag.ph, amp);
  const gr = ctx.createLinearGradient(0, H, 0, -H * belly);
  if (male) { gr.addColorStop(0, rgba([88, 96, 76], 0.96)); gr.addColorStop(0.5, rgba([150, 160, 140], 0.93)); gr.addColorStop(1, rgba([214, 214, 198], 0.92)); }
  else { gr.addColorStop(0, rgba([104, 106, 84], 0.96)); gr.addColorStop(0.55, rgba([160, 160, 136], 0.93)); gr.addColorStop(1, rgba([222, 220, 202], 0.92)); }
  ctx.fillStyle = gr; ctx.fill();
  ctx.save(); ctx.clip();
  if (coloured) {
    // Y-linked colour patches: the pattern a son inherits from his father
    for (const q of g.y.p) {
      const [c, px, py, r, e, ang] = q;
      const col = ENC[c];
      const alpha = (c === 'o' ? 0.5 + 0.5 * g.o : c === 'k' ? 0.35 + 0.65 * g.k : c === 'g' || c === 'b' ? 0.3 + 0.55 * g.m : 0.85) * cj * fade;
      const X = -0.34 + px * 0.78, Y = py * H * 0.95;

      const aa = alpha * (c === 'g' || c === 'b' ? 0.8 : 0.95);
      ctx.fillStyle = rgba(col, aa * 0.45);
      ctx.beginPath(); ctx.ellipse(X, Y, rx * 1.25, ry * 1.18, ang, 0, TAU); ctx.fill();
      ctx.fillStyle = rgba(col, aa);
      ctx.beginPath(); ctx.ellipse(X, Y, rx * 0.85, ry * 0.85, ang, 0, TAU); ctx.fill();
    }
    // metallic sheen that shifts as he turns
    const sh = 0.5 + 0.5 * Math.sin(ag.yaw * 2 + V.t * 0.5);
    ctx.fillStyle = `rgba(110,255,200,${0.14 * g.m * sh * fade})`; ctx.fillRect(-0.4, 0, 0.9, H);
  }
  if (preg > 0.15) {
    // the gravid spot darkens as the brood develops
    ctx.fillStyle = `rgba(30,24,20,${0.2 + 0.5 * preg})`;
    ctx.beginPath(); ctx.ellipse(-0.08, -H * 0.5, 0.06 + preg * 0.04, H * 0.3, 0.25, 0, TAU); ctx.fill();
  }
  ctx.restore();
  eye(ctx, 0.37, 0.022, 0.042, 'rgba(165,168,145,0.9)');
}

function drawCory(ctx, ag) {
  const a = ag.a, g = a.g;
  fishFrame(ctx, ag);
  const night = V.L.night;
  const fem = a.sex === 0;
  const H = fem ? 0.142 : 0.13, amp = 0.025 + Math.min(0.04, ag.spd * 0.004);
  const st = g.st || 0.8, tn = g.tn || 0.5;
  const bend = bodyPath(ctx, H, 0.95, ag.ph, amp, 0.035);
  ctx.fillStyle = 'rgba(210,215,205,0.3)';
  tailPath(ctx, bend, 0.13, 0.5, 0.16, false); ctx.fill();
  // dorsal fin with a dark tip, pectoral spine, and the little adipose fin
  ctx.fillStyle = 'rgba(205,210,200,0.4)';
  finPath(ctx, [0.13, H * 0.95 + bend(0.13), 0.06, H * 1.75 + bend(0.06), 0.0, H * 1.0 + bend(0)]); ctx.fill();
  ctx.fillStyle = `rgba(30,30,30,${0.35 * st})`;
  finPath(ctx, [0.085, H * 1.45 + bend(0.085), 0.06, H * 1.75 + bend(0.06), 0.045, H * 1.47 + bend(0.045)]); ctx.fill();
  ctx.fillStyle = 'rgba(200,205,195,0.45)'; ctx.beginPath(); ctx.ellipse(-0.27, H * 0.42 + bend(-0.27), 0.03, 0.016, -0.2, 0, TAU); ctx.fill();
  finPath(ctx, [0.3, -H * 0.55, 0.16, -H * 1.35, 0.2, -H * 0.6]); ctx.fillStyle = 'rgba(210,215,205,0.35)'; ctx.fill();
  bodyPath(ctx, H, 0.95, ag.ph, amp, 0.035);
  const c0 = lerp(170, 205, tn), gr = ctx.createLinearGradient(0, H, 0, -H);
  gr.addColorStop(0, `rgba(${c0 * 0.62},${c0 * 0.64},${c0 * 0.6},0.96)`); gr.addColorStop(0.55, `rgba(${c0},${c0 * 1.01},${c0 * 0.96},0.95)`); gr.addColorStop(1, 'rgba(236,236,228,0.95)');
  ctx.fillStyle = gr; ctx.fill();
  ctx.save(); ctx.clip();
  // the black lateral stripe from gill to tail spot
  ctx.fillStyle = `rgba(22,22,22,${(0.5 + 0.45 * st) * (1 - night * 0.3)})`;
  ctx.beginPath();
  for (let i = 0; i <= 10; i++) { const x = 0.3 - i * 0.068; ctx.lineTo(x, bend(x) + 0.004 - 0.01 * (1 - st)); }
  for (let i = 10; i >= 0; i--) { const x = 0.3 - i * 0.068; ctx.lineTo(x, bend(x) - 0.024 - 0.016 * st); }
  ctx.fill();
  ctx.beginPath(); ctx.arc(-0.36, bend(-0.36) - 0.01, 0.03, 0, TAU); ctx.fill();
  // armour plates catch the light
  ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 0.008;
  ctx.beginPath(); for (let i = 0; i < 7; i++) { const x = 0.22 - i * 0.075; ctx.moveTo(x, H * 0.9); ctx.lineTo(x - 0.03, -H * 0.8); } ctx.stroke();
  ctx.restore();
  // barbels
  ctx.strokeStyle = 'rgba(200,200,190,0.6)'; ctx.lineWidth = 0.01;
  ctx.beginPath(); ctx.moveTo(0.48, -0.03); ctx.lineTo(0.55, -0.065); ctx.moveTo(0.47, -0.04); ctx.lineTo(0.52, -0.085); ctx.stroke();
  eye(ctx, 0.33, 0.055, 0.04, 'rgba(170,178,168,0.95)');
}

function shrimpColour(a) {
  const g = a.g;
  if (g.R == null) g.R = PHEN.shRed(g);
  const wild = g.w1 && g.w2;
  const r = wild ? 0.08 : g.R * (a.sex === 1 ? 0.62 : 1) * clamp(a.L / 1.4, 0.15, 1) * (a.soft > 0 ? 0.5 : 1);
  return { r, wild, ti: g.ti || 0 };
}
function drawShrimp(ctx, ag) {
  const a = ag.a;
  const z = ag.z, L = a.L;
  setWorld(ctx, z);
  const k = kz(z);
  if (L * k < 5) { // tiny shrimplet: a dot
    const c = shrimpColour(a);
    ctx.fillStyle = `rgba(${200 * c.r + 150 * (1 - c.r)},${70 + 90 * (1 - c.r)},${60 + 60 * (1 - c.r)},0.6)`;
    ctx.beginPath(); ctx.ellipse(ag.x, ag.y + 0.08, L * 0.5, L * 0.18, 0, 0, TAU); ctx.fill();
    return;
  }
  const c = shrimpColour(a);
  const face = ag.mode === 'swim' ? (Math.cos(ag.hd) >= 0 ? 1 : -1) : (ag.surf === 'fg' || ag.surf === 'bg' ? (Math.cos(ag.hd) >= 0 ? 1 : -1) : (Math.cos(ag.hd) >= 0 ? 1 : -1));
  const ang = ag.surf === 'fg' || ag.surf === 'bg' ? clamp(Math.sin(ag.hd), -0.9, 0.9) * 0.6 : ag.mode === 'swim' ? clamp(Math.sin(ag.hd), -1, 1) * 0.5 : 0;
  ctx.translate(ag.x, ag.y + L * 0.18);
  ctx.rotate(ang * face);
  ctx.scale(face * L, L);
  // colour: selected red over a clear body; wild type brown-green with dark bands
  const hue = c.wild ? 32 : 2 + c.ti * 30, sat = c.wild ? 0.35 : 0.2 + 0.7 * c.r, lig = c.wild ? 0.34 : 0.72 - 0.32 * c.r;
  const alpha = 0.35 + 0.6 * Math.max(c.r, c.wild ? 0.6 : 0);
  const peck = Math.sin(ag.ph * 1.7) * 0.02;
  // legs
  ctx.strokeStyle = hsl(hue, sat * 0.8, lig + 0.1, alpha * 0.9); ctx.lineWidth = 0.022;
  ctx.beginPath();
  for (let i = 0; i < 5; i++) { const x = 0.28 - i * 0.07, sw = Math.sin(ag.ph + i) * 0.03; ctx.moveTo(x, -0.06); ctx.lineTo(x + 0.03 + sw, -0.2); }
  for (let i = 0; i < 4; i++) { const x = -0.06 - i * 0.08, sw = Math.sin(ag.ph * 2 + i) * 0.02; ctx.moveTo(x, -0.08); ctx.lineTo(x - 0.02 + sw, -0.15); }
  // chelipeds picking at the surface
  ctx.moveTo(0.33, -0.06); ctx.lineTo(0.42, -0.16 + peck);
  ctx.stroke();
  // antennae
  ctx.strokeStyle = hsl(hue, sat * 0.6, lig + 0.15, alpha * 0.7); ctx.lineWidth = 0.012;
  ctx.beginPath();
  const aw = Math.sin(V.t * 1.6 + ag.seed * 7) * 0.1;
  ctx.moveTo(0.45, 0.04); ctx.bezierCurveTo(0.7, 0.2, 1.0, 0.05 + aw, 1.25, -0.2 + aw);
  ctx.moveTo(0.45, 0.03); ctx.bezierCurveTo(0.65, 0.25, 0.9, 0.3 - aw, 1.1, 0.12 - aw);
  ctx.moveTo(0.46, 0.05); ctx.lineTo(0.62, 0.13 + aw * 0.3);
  ctx.stroke();
  // eggs under the abdomen when berried
  if (a.ber >= 0 && a.eggs > 0) {
    const dev = clamp(a.ber / 28, 0, 1);
    ctx.fillStyle = `rgba(${lerp(250, 200, dev)},${lerp(200, 160, dev)},${lerp(40, 70, dev)},0.9)`;
    ctx.beginPath(); ctx.ellipse(-0.1, -0.1, 0.17, 0.08 + 0.02 * Math.min(1, a.eggs / 30), 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(40,20,10,0.5)';
    for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.arc(-0.22 + i * 0.045, -0.1 + ((i & 1) ? 0.02 : -0.02), 0.012 * dev, 0, TAU); ctx.fill(); }
  }
  // body: carapace and a curved abdomen
  ctx.beginPath();
  ctx.moveTo(0.5, 0.05);                 // rostrum
  ctx.lineTo(0.36, 0.1);
  ctx.bezierCurveTo(0.25, 0.16, 0.06, 0.17, -0.05, 0.14);
  ctx.bezierCurveTo(-0.22, 0.12, -0.34, 0.06, -0.4, -0.02);
  ctx.lineTo(-0.5, -0.02); ctx.lineTo(-0.52, -0.1); ctx.lineTo(-0.42, -0.08);
  ctx.bezierCurveTo(-0.3, -0.06, -0.18, -0.05, -0.05, -0.05);
  ctx.bezierCurveTo(0.12, -0.05, 0.3, -0.05, 0.4, 0.0);
  ctx.closePath();
  const gr = ctx.createLinearGradient(0, 0.17, 0, -0.06);
  gr.addColorStop(0, hsl(hue, sat, lig * 0.85, alpha)); gr.addColorStop(1, hsl(hue, sat * 0.8, Math.min(0.85, lig + 0.12), alpha * 0.85));
  ctx.fillStyle = gr; ctx.fill();
  // segment lines and the wild-type bands
  ctx.strokeStyle = c.wild ? 'rgba(40,30,20,0.55)' : hsl(hue, sat, lig * 0.7, alpha * 0.5); ctx.lineWidth = c.wild ? 0.03 : 0.012;
  ctx.beginPath(); for (let i = 0; i < 5; i++) { const x = -0.05 - i * 0.07; ctx.moveTo(x, 0.14 - i * 0.02); ctx.lineTo(x - 0.01, -0.05); } ctx.stroke();
  // saddle of developing eggs behind the head
  if (a.sad > 0.3 && a.sex === 0) { ctx.fillStyle = `rgba(250,210,70,${0.55 * a.sad})`; ctx.beginPath(); ctx.ellipse(0.08, 0.12, 0.1, 0.035, 0, 0, TAU); ctx.fill(); }
  ctx.fillStyle = '#0a0a0a'; ctx.beginPath(); ctx.arc(0.38, 0.08, 0.035, 0, TAU); ctx.fill();

const SEX = ['Female', 'Male', 'Hermaphrodite'];

 * Picking: animals, clutches, plants, frogbit, micro-life, hardscape,
 * hardware, substrate, water
